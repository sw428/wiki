<svg xmlns="http://www.w3.org/2000/svg" width="440" height="401" viewBox="0 0 440 401" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">疑似要素はリンクの箱の内側に追加される</title><desc id="desc">inline-flexのリンクでは文字の後ろの::afterはflex itemとして扱われる。左padding、文字、gap、after、右paddingがすべてリンクの内側に含まれる。</desc><style>
text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;fill:#000000}
.head{font-size:20px;font-weight:700}
.sub{font-size:18px;font-weight:700}
.copy{font-size:16.5px}
.small{font-size:14px}
.mono{font-family:Consolas,monospace;font-size:16px}
.parent{fill:#f5f5f5;stroke:#666666;stroke-width:2}
.blue{fill:#cfe4ff;stroke:#315fa0;stroke-width:2}
.red{fill:#f8cfd6;stroke:#c93030;stroke-width:2}
.green{fill:#cae6d1;stroke:none}
.purple{fill:#ece5ff;stroke:none}
.blue-label{fill:#315fa0;font-weight:700}
.red-label{fill:#c93030;font-weight:700}
.green-label{fill:#26724a;font-weight:700}
.purple-label{fill:#7c3aed;font-weight:700}
.code-red{fill:#c93030;font-weight:700}
.note{font-size:13px;fill:#444444}
</style><rect width="440" height="401" fill="#ffffff"/>
<text x="18" y="34" class="head">疑似要素もリンクの中に入る</text>
<text x="20" y="67" class="mono">.link { display: inline-flex; }</text>
<text x="20" y="91" class="mono"><tspan class="code-red">gap: 10px; padding-inline: 20px;</tspan></text>
<rect x="17" y="111" width="406" height="217" rx="8" class="parent"/>
<text x="31" y="140" class="small">リンク全体の箱</text>
<rect x="34" y="176" width="48" height="83" class="green"/>
<rect x="82" y="176" width="192" height="83" rx="4" class="blue"/>
<text x="178" y="224" class="copy" text-anchor="middle">詳しく見る</text>
<rect x="274" y="176" width="22" height="83" class="purple"/>
<rect x="296" y="176" width="79" height="83" rx="4" class="red"/>
<text x="335.5" y="224" class="copy" text-anchor="middle">›</text>
<rect x="375" y="176" width="32" height="83" class="green"/>
<path d="M57 259 V281 M285 259 V281 M390 259 V281" stroke="#526780" stroke-width="1.5"/>
<text x="57" y="300" class="small green-label" text-anchor="middle">padding</text>
<text x="285" y="300" class="small purple-label" text-anchor="middle">gap</text>
<text x="391" y="300" class="small green-label" text-anchor="middle">padding</text>
<text x="335" y="164" class="small red-label" text-anchor="middle">::after</text>
<text x="20" y="355" class="small">› はリンクの外へ追加された兄弟要素ではない。</text>
<text x="20" y="391" class="note">※ 灰色の枠は範囲を示す補助線で、CSSのborderではありません。</text>
</svg>
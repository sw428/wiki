<svg xmlns="http://www.w3.org/2000/svg" width="760" height="407.26" viewBox="0 0 920 493" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">子のwidthを外しても、列幅は変わらない</title><desc id="desc">150pxの列と30pxの列間はそのまま、子の幅70pxを指定した状態と指定を外して列まで伸びる状態を比較する。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="493" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>

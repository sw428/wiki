<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">親の幅の中に、2本の列を作る</title><desc id="desc">幅460pxに列間20pxを取り、各220pxの2列を作る。列は縦に伸びる配置の帯で、高さはまだ示していない。</desc><metadata id="grid-data">{&quot;type&quot;:&quot;structure&quot;,&quot;width&quot;:460,&quot;columns&quot;:[220,220],&quot;gx&quot;:20,&quot;openBottom&quot;:true}</metadata><defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M7,1 L1,4 L7,7" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:24px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.active{fill:#c93030}.small{font-size:18px}.note{font-size:12px;fill:#000000}.parent-label{fill:#444444}.parent{fill:#f5f5f5}.edge{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:none;stroke-opacity:1}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.gapfill{fill:#ECE5FF;stroke:none}.column-frame{fill:none;stroke:#007F99;stroke-width:1.5}.row-frame{fill:none;stroke:#D66A00;stroke-width:1.5}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><rect width="760" height="560" fill="#ffffff"/><text x="24" y="34" class="title">親の幅の中に、2本の列を作る</text><text x="452" y="63" class="note">※ 灰色の線はborderではなく、</text><text x="452" y="81" class="note">親の範囲を示す補助線です。</text><text x="24" y="100" class="code" xml:space="preserve">.parent {</text><text x="24" y="125" class="code" xml:space="preserve">  display: grid;</text><text x="24" y="150" class="code active" xml:space="preserve">  grid-template-columns: 1fr 1fr;</text><text x="24" y="175" class="code" xml:space="preserve">  column-gap: 20px;</text><text x="24" y="200" class="code" xml:space="preserve">}</text><rect x="76" y="290" width="460" height="150" class="parent "/><rect x="296" y="290" width="20" height="150" class="gapfill"/><path class="column-frame" d="M76,440 V290 H296 V440 M316,440 V290 H536 V440"/><path class="edge" d="M73.25,440 V287.25 H538.75 V440"/><text x="130" y="267" class="column">1列目</text><text x="370" y="267" class="column">2列目</text><line x1="76" y1="468" x2="296" y2="468" stroke="#007F99" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="186" y="458" class="small" text-anchor="middle" fill="#007F99" style="fill:#007F99">220px</text><line x1="316" y1="468" x2="536" y2="468" stroke="#007F99" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="426" y="458" class="small" text-anchor="middle" fill="#007F99" style="fill:#007F99">220px</text><text x="570" y="338" class="gap">列間 20px</text><text x="570" y="373" class="small">高さは後で見る</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446.91" viewBox="0 0 920 541" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">長さの異なる本文でも、日付を下に揃える</title><desc id="desc">同じGrid行の二枚のカードは同じ高さを受け取り、内部のbodyが残りを取り、短い本文のdate上のauto marginが空き領域を受け取って日付が下へ揃う。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="541" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">長さの異なる本文でも、日付を下に揃える</text>
<rect x="42" y="80" width="824" height="404" rx="12" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<text x="63" y="113" font-size="18" fill="#444444" font-weight="700">一覧：同じ行の二枚のカード（同じ高さ）</text>

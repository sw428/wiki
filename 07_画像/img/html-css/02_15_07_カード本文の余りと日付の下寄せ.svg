<rect x="500" y="219" width="300" height="213" rx="5" fill="#F1F5FA" stroke="#DCE4EE" stroke-width="2"/>
<text x="122" y="248" font-size="18" fill="#25384F" font-weight="700">タイトルA</text>
<text x="122" y="283" font-size="17" fill="#25384F" font-weight="400">短い本文</text>
<rect x="111" y="296" width="298" height="89" rx="0" fill="#f9cc9d" stroke="none" stroke-width="1"/>
<text x="259" y="342" font-size="17" fill="#793A00" font-weight="600" text-anchor="middle">auto marginが受け取る空き</text>
<text x="122" y="411" font-size="18" fill="#25384F" font-weight="700">2026.11.20</text>
<text x="512" y="248" font-size="18" fill="#25384F" font-weight="700">タイトルB</text>
<text x="512" y="283" font-size="17" fill="#25384F" font-weight="400">長い本文を入れたカード</text>
<text x="512" y="314" font-size="17" fill="#25384F" font-weight="400">文章が増えても、</text>
<text x="512" y="342" font-size="17" fill="#25384F" font-weight="400">カード下端は共通</text>
<text x="512" y="411" font-size="18" fill="#25384F" font-weight="700">2026.11.20</text>
<line x1="95" y1="431" x2="813" y2="431" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
<text x="325" y="516" font-size="16" fill="#000000" font-weight="400">※ 日付の下端を比較。図中の色付き枠は位置を示す補助表示です。</text></svg>
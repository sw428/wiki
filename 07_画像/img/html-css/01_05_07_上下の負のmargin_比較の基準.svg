<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">比較の基準：子Bの上下marginが0</title>
<desc id="desc">通常フローで各兄弟の高さ100px、幅200px。ほかの上下margin・padding・border・位置指定は加えず、中の子のmarginは0。指定前はA・B・C・Dが順に並び、それぞれの子を内側に持つ。矢印は指定前からの移動量。親枠は灰色実線、重なった面積は灰色点線。外枠は実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。</desc>
<metadata id="margin-data">{"type":"static","conditions":{"flow":"normal-block","height":100,"width":200,"otherVerticalMargins":0,"padding":0,"border":0,"position":"static","grandchildMargin":0,"marginInline":"auto"},"specifiedOn":"B","marginTop":0,"marginBottom":0,"parentHeight":400,"items":[{"id":"A","x":0,"y":0,"w":200,"h":100,"fill":"#cfe4ff","stroke":"#315fa0","grandchild":{"fill":"#fbe0eb","stroke":"#be185d"}},{"id":"B","x":0,"y":100,"w":200,"h":100,"fill":"#f8cfd6","stroke":"#c93030","grandchild":{"fill":"#f3dcf7","stroke":"#a21caf"}},{"id":"C","x":0,"y":200,"w":200,"h":100,"fill":"#e9ddff","stroke":"#7c3aed","grandchild":{"fill":"#cfe4ff","stroke":"#315fa0"}},{"id":"D","x":0,"y":300,"w":200,"h":100,"fill":"#fbe0eb","stroke":"#be185d","grandchild":{"fill":"#e9ddff","stroke":"#7c3aed"}}],"plot":{"x":40,"y":110},"arrowsFrom":"normal-position","display":"horizontal layout and grandchild dimensions are schematic"}</metadata>
<style>text{font-family:"Yu Gothic",Meiryo,sans-serif;font-size:22px;font-weight:500;fill:#000000}.parent-label{fill:#444444}.note{font-size:22px;fill:#000000}.owner{fill:#c93030}.parent-edge{stroke:#666666;stroke-width:2;stroke-dasharray:none;fill:none}</style>
<rect width="500" height="600" fill="#ffffff"/>
<defs>
<marker id="move-1" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#c93030" stroke-width="2"/></marker>
<marker id="move-2" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker>
<marker id="move-3" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#be185d" stroke-width="2"/></marker>

</defs>
<text x="15" y="26" class="parent-label">親 .parent</text>
<text x="180" y="26">各兄弟の高さ100px</text>
<text x="15" y="62" class="owner">子B：上0px ／ 下0px</text>
<rect x="15" y="110" width="250" height="400" fill="#f5f5f5"/>
<rect data-child="A" x="40" y="110" width="200" height="100" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<rect data-child="B" x="40" y="210" width="200" height="100" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<rect data-child="C" x="40" y="310" width="200" height="100" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<rect data-child="D" x="40" y="410" width="200" height="100" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>

<text data-label="A" x="52" y="146" style="fill:#315fa0">子A .a</text>
<rect data-grandchild="A" x="132" y="122" width="100" height="38" fill="#fbe0eb" stroke="#be185d" stroke-width="1.5"/>
<text data-grandchild-label="A" x="182" y="148" text-anchor="middle" style="fill:#be185d">子Aの子</text>
<text data-label="B" x="52" y="246" style="fill:#c93030">子B .b</text>
<rect data-grandchild="B" x="132" y="222" width="100" height="38" fill="#f3dcf7" stroke="#a21caf" stroke-width="1.5"/>
<text data-grandchild-label="B" x="182" y="248" text-anchor="middle" style="fill:#a21caf">子Bの子</text>
<text data-label="C" x="52" y="346" style="fill:#7c3aed">子C .c</text>
<rect data-grandchild="C" x="132" y="322" width="100" height="38" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-grandchild-label="C" x="182" y="348" text-anchor="middle" style="fill:#315fa0">子Cの子</text>
<text data-label="D" x="52" y="446" style="fill:#be185d">子D .d</text>
<rect data-grandchild="D" x="132" y="422" width="100" height="38" fill="#e9ddff" stroke="#7c3aed" stroke-width="1.5"/>
<text data-grandchild-label="D" x="182" y="448" text-anchor="middle" style="fill:#7c3aed">子Dの子</text>
<rect class="parent-edge" x="12" y="107" width="256" height="406" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1"/>


<text x="15" y="550" class="note">※ 灰色の線はborderではなく、</text>
<text x="15" y="586" class="note">親の範囲を示す補助線です。</text>
</svg>

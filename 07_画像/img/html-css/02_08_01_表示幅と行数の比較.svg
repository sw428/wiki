<svg xmlns="http://www.w3.org/2000/svg" width="720" height="947.5" viewBox="0 0 720 947.5" role="img" aria-labelledby="figureTitle figureDesc">
<title id="figureTitle">表示幅と行数の比較</title><desc id="figureDesc">親幅240pxでは文章が1行で高さ30px。親幅120pxにすると同じ文章が2行に折り返され高さ60pxとなり、次の要素が30px下がる。</desc>
<defs><filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#233E61" flood-opacity=".07"/></filter></defs>
<style>text { font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif; } </style>

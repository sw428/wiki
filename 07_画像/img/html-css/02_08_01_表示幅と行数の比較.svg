452.5 L 369 441.5" stroke="#3C70BC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="415.5" width="174" height="32" rx="8" fill="#F6F9FE" stroke="none" stroke-width="1" /><text x="418" y="439.5" fill="#255AA4" font-size="21" font-weight="600" text-anchor="start" >幅だけ半分に</text><rect x="34" y="463.5" width="652" height="346" rx="22" fill="#FFFFFF" stroke="#DAE5F1" stroke-width="2" filter="url(#softShadow)"/><circle cx="76" cy="506.5" r="21" fill="#3C70BC"/><text x="76" y="514.5" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle" >2</text><text x="112" y="514.5" fill="#19334C" font-size="29" font-weight="700" text-anchor="start" >親幅 120px</text><rect x="548" y="481.5" width="107" height="43" rx="22" fill="#DFEEFF" stroke="none" stroke-width="1" /><text x="601" y="511.5" fill="#255AA4" font-size="26" font-weight="700" text-anchor="middle" >2行</text><rect x="80" y="544.5" width="240" height="135" rx="8" fill="#E7F0FF" stroke="#8DAEE6" stroke-width="2" /><line x1="81" y1="612" x2="319" y2="612" stroke="#B2CBF1" stroke-width="2" stroke-dasharray="6 6" /><text x="98" y="593.25" fill="#19334C" font-size="28" font-weight="650" text-anchor="start" >テキストテキ</text><text x="98" y="660.75" fill="#19334C" font-size="28" font-weight="650" text-anchor="start" >スト</text><rect x="80" y="679.5" width="240" height="56" rx="8" fill="#FFF2E0" stroke="#EAC397" stroke-width="2" /><text x="98" y="716.5" fill="#C46F27" font-size="27" font-weight="700" text-anchor="start" >テキスト</text><text x="372" y="569.5" fill="#576C80" font-size="24" font-weight="500" text-anchor="start" >行が1行増える</text><text x="372" y="622" fill="#255AA4" font-size="28" font-weight="700" text-anchor="start" >30px → 60px</text><line x1="361" y1="650.75" x2="636" y2="650.75" stroke="#E9EEF6" stroke-width="2"  /><path d="M 376 672 V 713.5 M 366 701.5 L 376 713.5 L 386 701.5" fill="none" stroke="#C46F27" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="407" y="690.5" fill="#C46F27" font-size="25" font-weight="650" text-anchor="start" >次の要素も</text><text x="407" y="727.5" fill="#C46F27" font-size="30" font-weight="750" text-anchor="start" >30px下がる</text><text x="80" y="779.5" fill="#576C80" font-size="21" font-weight="500" text-anchor="start" >2行分の高さ：60px</text><rect x="34" y="828.5" width="652" height="97" rx="18" fill="#E5EFFD" stroke="none" stroke-width="1" /><circle cx="71" cy="874.5" r="17" fill="#3C70BC"/><path d="M 63 873.5 l 6 6 l 12 -13" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="101" y="867.5" fill="#19334C" font-size="25" font-weight="700" text-anchor="start" >行高の指定は変わらない</text><text x="101" y="902.5" fill="#576C80" font-size="23" font-weight="450" text-anchor="start" >行が増えたぶん、段落と下の部品が動く</text>

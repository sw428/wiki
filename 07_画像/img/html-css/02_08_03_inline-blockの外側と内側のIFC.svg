<svg xmlns="http://www.w3.org/2000/svg" width="420" height="551" viewBox="0 0 343 450" role="img" aria-labelledby="title desc">
  <title id="title">inline-blockの外側と内側のIFC</title>
  <desc id="desc">外側のIFCでは、前の文字、inline-blockのリンク全体、後ろの文字が一行に並ぶ。リンクを拡大すると、独立した配置範囲であるBFCの内側にもう一つのIFCがあり、矢印画像とリンク文字がその行に並ぶ。リンクの中身が通常の流れにある文字とインラインレベルの箱だけの場合。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#3864a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; fill:#192947; }
    .title { font-size:21px; font-weight:700; }
    .heading { font-size:16px; font-weight:700; }
    .label { font-size:14px; font-weight:600; }
    .detail { font-size:13px; fill:#3b4a63; }
    .boxlabel { font-size:13px; font-weight:700; fill:#244c8e; }
    .green { fill:#175649; }
  </style>

  <rect width="343" height="450" fill="#fff"/>
  <text class="title" x="17" y="34">inline-block の外側と内側</text>
  <text class="detail" x="17" y="60">中身が通常の流れの文字・インラインの箱だけの場合</text>

  <rect x="12" y="77" width="319" height="138" rx="12" fill="#f5f7fd" stroke="#b3c3de"/>
  <text class="heading" x="25" y="104">外側のIFC</text>
  <text class="detail" x="25" y="126">文章の行では、リンク全体がひとつの箱。</text>
  <rect x="23" y="141" width="297" height="57" rx="7" fill="#fff" stroke="#7187ae" stroke-dasharray="4 3"/>
  <text class="label" x="66" y="175" text-anchor="middle">前の文字</text>
  <rect x="112" y="150" width="119" height="39" rx="6" fill="#dcebff" stroke="#3864a3" stroke-width="1.6"/>
  <text class="boxlabel" x="171.5" y="167" text-anchor="middle">リンク全体</text>
  <text class="detail" x="171.5" y="182" text-anchor="middle">inline-block</text>
  <text class="label" x="275" y="175" text-anchor="middle">後ろの文字</text>

  <path d="M171.5 190v27" stroke="#3864a3" stroke-width="1.5" fill="none"/>
  <path d="M171.5 242v22" stroke="#3864a3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="boxlabel" x="171.5" y="235" text-anchor="middle">リンクの中を拡大</text>

  <rect x="12" y="267" width="319" height="166" rx="12" fill="#e7f0ff" stroke="#3864a3" stroke-width="1.5"/>
  <text class="heading" x="25" y="294">BFC</text>
  <text class="detail" x="67" y="293">リンクが作る独立した配置範囲</text>

  <rect x="23" y="308" width="297" height="112" rx="8" fill="#e5f5ee" stroke="#478674"/>
  <text class="heading green" x="35" y="333">内側のIFC</text>
  <text class="detail" x="35" y="354">矢印画像と文字を行に並べる仕組み。</text>
  <rect x="34" y="365" width="275" height="42" rx="6" fill="#fff" stroke="#478674" stroke-dasharray="4 3"/>
  <rect x="44" y="372" width="88" height="28" rx="5" fill="#fdf0d9" stroke="#a77128"/>
  <text class="label" x="53" y="391"><tspan fill="#88591b">→</tspan><tspan dx="5">矢印画像</tspan></text>
  <rect x="143" y="372" width="111" height="28" rx="5" fill="#e5f5ee" stroke="#478674"/>
  <text class="label green" x="198.5" y="391" text-anchor="middle">詳しく見る</text>
</svg>

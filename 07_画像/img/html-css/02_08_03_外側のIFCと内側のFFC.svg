<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355.22" viewBox="0 0 920 430" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図① 文章の行の中に、inline-flexの箱がある</title><desc id="desc">文章の行に置かれたリンクの箱は外側の行の配置を受け、内側では画像と文字がFlexアイテムとして並ぶ。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="430" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">図① 文章の行の中に、inline-flexの箱がある</text>
<rect x="45" y="84" width="830" height="286" rx="14" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<text x="68" y="118" font-size="18" fill="#444444" font-weight="700">外側：文章の行の中で、リンク全体を置く</text>
<text x="80" y="215" font-size="20" fill="#000000" font-weight="400">前の文字</text>
<rect x="220" y="157" width="480" height="125" rx="9" fill="#ffffff" stroke="#315fa0" stroke-width="2"/>
<text x="242" y="187" font-size="18" fill="#315fa0" font-weight="700">inline-flex（リンク全体）</text>
<rect x="248" y="205" width="130" height="51" rx="5" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="313" y="238" font-size="18" fill="#000000" font-weight="400" text-anchor="middle">画像</text>
<rect x="401" y="205" width="251" height="51" rx="5" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="526" y="238" font-size="18" fill="#000000" font-weight="400" text-anchor="middle">詳しく見る</text>
<text x="719" y="215" font-size="20" fill="#000000" font-weight="400">後の文字</text>
<text x="60" y="340" font-size="16" fill="#000000" font-weight="400">リンク全体は、前後の文字と同じ行に参加する</text>
<text x="45" y="405" font-size="15" fill="#444444" font-weight="400">※ 灰色の枠は説明用で、CSSのborderではありません。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384.13" viewBox="0 0 920 465" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">指定された5列目のために、空の列も追加される</title><desc id="desc">2列を明示した510pxの親で、子Aにgrid-column 5 / 6を指定すると3〜5列目が追加され、全体は870px分になる。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="465" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">指定された5列目のために、空の列も追加される</text>
<rect x="48" y="137" width="421" height="187" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<text x="62" y="123" font-size="18" fill="#25384F" font-weight="700">親：内容幅510px</text>
<rect x="48" y="180" width="128" height="112" rx="3" fill="#ffffff" stroke="#007F99" stroke-width="2"/>
<text x="112.0" y="167" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">1列目</text>
<rect x="202" y="180" width="128" height="112" rx="3" fill="#ffffff" stroke="#007F99" stroke-width="2"/>
<text x="266.0" y="167" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">2列目</text>
<rect x="356" y="180" width="128" height="112" rx="3" fill="#ffffff" stroke="#007F99" stroke-width="2" stroke-dasharray="7 5"/>
<text x="420.0" y="167" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">3列目</text>
<rect x="510" y="180" width="128" height="112" rx="3" fill="#ffffff" stroke="#007F99" stroke-width="2" stroke-dasharray="7 5"/>
<text x="574.0" y="167" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">4列目</text>
<rect x="664" y="180" width="128" height="112" rx="3" fill="#ffffff" stroke="#007F99" stroke-width="2" stroke-dasharray="7 5"/>
<text x="728.0" y="167" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">5列目</text>
<rect x="666" y="182" width="124" height="108" rx="4" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="728.0" y="245" font-size="24" fill="#000000" font-weight="400" text-anchor="middle">A</text>
<line x1="469" y1="145" x2="469" y2="338" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>
<text x="486" y="351" font-size="17" fill="#7C3AED" font-weight="400">← 親の右端</text>
<text x="38" y="402" font-size="18" fill="#25384F" font-weight="400">明示は2列。3〜5列目が追加され、全体は870px分になる。</text>
<text x="38" y="441" font-size="16" fill="#000000" font-weight="400">※ 灰色の枠は親の範囲。シアンの破線は追加された列です。</text></svg>
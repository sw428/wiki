olumn-gap: 20px;</text><text x="24" y="200" class="code" xml:space="preserve">}</text><text x="130" y="267" class="column">1列目</text><text x="370" y="267" class="column">2列目</text><rect x="76" y="290" width="460" height="120" class="parent "/><rect x="296" y="290" width="20" height="120" class="gapfill"/><rect x="76" y="290" width="220" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" data-child="A"/><text x="88" y="317" style="fill:#315fa0">A</text><rect x="316" y="290" width="220" height="40" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" data-child="B"/><text x="328" y="317" style="fill:#c93030">B</text><text x="570" y="317" class="row">1行目</text><rect x="76" y="330" width="460" height="0" class="gapfill"/><rect x="76" y="330" width="220" height="40" fill="#f3dcf7" stroke="#a21caf" stroke-width="1.5" data-child="C"/><text x="88" y="357" style="fill:#a21caf">C</text><rect x="316" y="330" width="220" height="40" fill="#fbe0eb" stroke="#be185d" stroke-width="1.5" data-child="D"/><text x="328" y="357" style="fill:#be185d">D</text><text x="570" y="357" class="row">2行目</text><rect x="76" y="370" width="460" height="0" class="gapfill"/><rect x="76" y="370" width="220" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" data-child="E"/><text x="88" y="397" style="fill:#315fa0">E</text><rect x="316" y="370" width="220" height="40" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" data-child="F"/><text x="328" y="397" style="fill:#c93030">F</text><text x="570" y="397" class="row">3行目</text><rect x="73.25" y="287.25" width="465.5" height="125.5" class="edge " data-outline-gap="1"/><text x="76" y="468" class="small">行・列は領域。色の付いた箱が子。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="536" viewBox="0 0 440 536" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図④ Flexの中心とベースラインは異なる基準</title><desc id="desc">align-items centerは画像と文字のアイテムの縦の中心を揃える。baselineは子のベースラインを共通線に揃える。画像側のベースラインの扱いは条件により異なる。</desc><style>
text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;fill:#000000}
.head{font-size:20px;font-weight:700}
.sub{font-size:18px;font-weight:700}
.copy{font-size:16.5px}
.small{font-size:14px}
.mono{font-family:Consolas,monospace;font-size:16px}
.parent{fill:#f5f5f5;stroke:#666666;stroke-width:2}
.blue{fill:#cfe4ff;stroke:#315fa0;stroke-width:2}
.red{fill:#f8cfd6;stroke:#c93030;stroke-width:2}
.green{fill:#cae6d1;stroke:none}
.purple{fill:#ece5ff;stroke:none}
.blue-label{fill:#315fa0;font-weight:700}
.red-label{fill:#c93030;font-weight:700}
.green-label{fill:#26724a;font-weight:700}
.purple-label{fill:#7c3aed;font-weight:700}
.code-red{fill:#c93030;font-weight:700}
.note{font-size:13px;fill:#444444}
</style><rect width="440" height="536" fill="#ffffff"/>
<text x="20" y="34" class="head">図④ 揃える基準が違う</text>
<text x="21" y="73" class="sub">align-items: center</text>
<rect x="20" y="89" width="400" height="168" rx="8" class="parent"/>
<rect x="49" y="118" width="96" height="103" rx="4" class="blue"/>
<text x="97" y="173" class="copy" text-anchor="middle">img</text>
<rect x="185" y="145" width="195" height="49" rx="4" class="red"/>
<text x="282" y="174" class="copy" text-anchor="middle">文字</text>
<path d="M36 169.5 H49 M145 169.5 H185 M380 169.5 H404" stroke="#26724a" stroke-width="2" stroke-dasharray="5 5"/>
<text x="30" y="246" class="small green-label">両方の箱の縦中心を通る線</text>
<text x="21" y="292" class="sub">align-items: baseline</text>
<rect x="20" y="309" width="400" height="174" rx="8" class="parent"/>
<rect x="49" y="329" width="96" height="107" rx="4" class="blue"/>
<text x="97" y="386" class="copy" text-anchor="middle">img</text>
<rect x="185" y="395" width="195" height="57" rx="4" class="red"/>
<text x="282" y="436" class="copy" text-anchor="middle">文字</text>
<path d="M36 436 H49 M145 436 H185 M380 436 H403" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
<text x="30" y="473" class="small purple-label">ベースラインを揃える</text>
<text x="21" y="511" class="note">※ 箱・字形・ベースラインの位置は仕組みを表す模式図です。</text>
<text x="21" y="530" class="note">画像の基準線の扱いも条件によって変わります。</text>
</svg>
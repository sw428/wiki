<svg xmlns="http://www.w3.org/2000/svg" width="760" height="413.04" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">列280pxと、見出しの箱の幅を分ける</title><desc id="desc">列280pxは変えず、Gridアイテムが引き伸ばされて幅280pxになった状態とjustify-self startで短くなった状態。前者のcontent幅は240px。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="500" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">列280pxと、見出しの箱の幅を分ける</text>
<rect x="30" y="78" width="425" height="360" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="54" y="116" font-size="19" fill="#193B64" font-weight="700">① 指定なし：背景が列いっぱい</text>
<rect x="470" y="78" width="425" height="360" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="494" y="116" font-size="19" fill="#193B64" font-weight="700">② justify-self: start</text>
<rect x="65" y="155" width="340" height="214" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="505" y="155" width="340" height="214" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="91" y="198" width="280" height="88" rx="0" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<rect x="91" y="198" width="20" height="88" rx="0" fill="#cae6d1" stroke="none" stroke-width="1"/>
<rect x="351" y="198" width="20" height="88" rx="0" fill="#cae6d1" stroke="none" stroke-width="1"/>
<text x="231" y="245" font-size="21" fill="#000000" font-weight="400" text-anchor="middle">国語</text>
<text x="231" y="310" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">280px = 20 + 240 + 20</text>
<rect x="531" y="198" width="120" height="88" rx="0" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<rect x="531" y="198" width="20" height="88" rx="0" fill="#cae6d1" stroke="none" stroke-width="1"/>
<rect x="631" y="198" width="20" height="88" rx="0" fill="#cae6d1" stroke="none" stroke-width="1"/>
<text x="592" y="245" font-size="20" fill="#000000" font-weight="400" text-anchor="middle">国語</text>
<text x="675" y="311" font-size="17" fill="#007F99" font-weight="600" text-anchor="middle">列幅は280pxのまま</text>
<text x="44" y="404" font-size="16" fill="#26724a" font-weight="400">左右の緑：padding 各20px</text>
<text x="485" y="404" font-size="16" fill="#315fa0" font-weight="400">青い箱だけが短くなる</text>
<text x="32" y="477" font-size="16" fill="#000000" font-weight="400">※ 二つ目の箱幅はフォントなどで変わるため模式図です。</text></svg>
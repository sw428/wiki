<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" viewBox="0 0 550 350" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">② 列幅と右側の余りを確かめる</title>
<desc id="desc">親の内容幅510pxに幅150pxの列を2本指定し、子A〜Fを2列3行に配置する。列の合計幅は300pxで、右側210pxは未使用領域。列間・行間のgapはまだない。子Aは赤、子B〜Fは青。</desc>
<metadata id="grid-data">{"type":"static","states":[{"width":510,"height":120,"rows":[40,40,40],"gapx":0,"gapy":0,"items":[{"id":"A","x":0,"y":0,"w":150,"h":40},{"id":"B","x":150,"y":0,"w":150,"h":40},{"id":"C","x":0,"y":40,"w":150,"h":40},{"id":"D","x":150,"y":40,"w":150,"h":40},{"id":"E","x":0,"y":80,"w":150,"h":40},{"id":"F","x":150,"y":80,"w":150,"h":40}]}],"plot":{"x":20,"y":126},"focus":"fixed-column-width-and-unused-space"}</metadata>
<style>
text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:24px;font-weight:500;fill:#000000}
.parent-label{font-size:26px;fill:#444444}.column{font-size:26px;fill:#007F99}
.unused{font-size:26px;fill:#000000}.note{font-size:24px;fill:#000000}
.column-line{stroke:#007F99;stroke-width:1.5;fill:none}
.parent-edge{stroke:#666666;stroke-width:2;fill:none;stroke-dasharray:none}
</style>
<rect width="550" height="350" fill="#ffffff"/>

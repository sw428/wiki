<rect data-child="D" x="170" y="166" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="D" x="180" y="194" style="fill:#315fa0">D</text>
<rect data-child="E" x="20" y="206" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="E" x="30" y="234" style="fill:#315fa0">E</text>

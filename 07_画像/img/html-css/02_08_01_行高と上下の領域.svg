<svg xmlns="http://www.w3.org/2000/svg" width="720" height="916" viewBox="0 0 720 916" role="img" aria-labelledby="figureTitle figureDesc">
<title id="figureTitle">行高と上下の領域</title><desc id="figureDesc">親幅120pxの文章2行で行の部分は60px。上下paddingが各10pxで20px、上下borderが各10pxで20px加わり、border boxは100pxになる。</desc>
<defs><filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#233E61" flood-opacity=".07"/></filter></defs>
<style>text { font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif; } </style>

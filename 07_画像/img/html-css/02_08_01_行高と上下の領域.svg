width="2.5"  /><circle cx="420" cy="330.25" r="4.7" fill="#255AA4"/><text x="436" y="339" fill="#19334C" font-size="22" font-weight="550" text-anchor="start" >1行目 30px</text><line x1="374" y1="420.25" x2="409" y2="420.25" stroke="#255AA4" stroke-width="2.5"  /><circle cx="420" cy="420.25" r="4.7" fill="#255AA4"/><text x="436" y="429" fill="#19334C" font-size="22" font-weight="550" text-anchor="start" >2行目 30px</text><line x1="374" y1="476" x2="409" y2="476" stroke="#5E9899" stroke-width="2.5"  /><circle cx="420" cy="476" r="4.7" fill="#5E9899"/><text x="436" y="483" fill="#19334C" font-size="22" font-weight="550" text-anchor="start" >下：padding＋border</text><text x="73" y="566" fill="#576C80" font-size="20" font-weight="400" text-anchor="start" >横幅と行数は同じ。上下に領域を足した状態</text><text x="39" y="641" fill="#19334C" font-size="28" font-weight="700" text-anchor="start" >箱の高さの内訳</text><rect x="38" y="657" width="200" height="147" rx="14" fill="#E5EFFD" stroke="none" stroke-width="1" /><text x="54" y="691" fill="#255AA4" font-size="22" font-weight="700" text-anchor="start" >行の部分</text><text x="54" y="732" fill="#576C80" font-size="23" font-weight="550" text-anchor="start" >30px × 2</text><text x="54" y="780" fill="#255AA4" font-size="35" font-weight="750" text-anchor="start" >60px</text><rect x="260" y="657" width="200" height="147" rx="14" fill="#E5F2F1" stroke="none" stroke-width="1" /><text x="276" y="691" fill="#397A7D" font-size="22" font-weight="700" text-anchor="start" >上下padding</text><text x="276" y="732" fill="#576C80" font-size="23" font-weight="550" text-anchor="start" >10px × 2</text><text x="276" y="780" fill="#397A7D" font-size="35" font-weight="750" text-anchor="start" >20px</text><rect x="482" y="657" width="200" height="147" rx="14" fill="#E8ECF2" stroke="none" stroke-width="1" /><text x="498" y="691" fill="#354D64" font-size="22" font-weight="700" text-anchor="start" >上下border</text><text x="498" y="732" fill="#576C80" font-size="23" font-weight="550" text-anc
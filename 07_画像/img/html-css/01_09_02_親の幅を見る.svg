<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">まず、配置に使う親の幅を見る</title><desc id="desc">外側で使える内容幅460pxに親が広がる。高さや中身はまだ示さず、親の範囲を下端省略で描く。</desc><metadata id="grid-data">{&quot;type&quot;:&quot;structure&quot;,&quot;width&quot;:460,&quot;openBottom&quot;:true}</metadata><defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M7,1 L1,4 L7,7" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:24px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.active{fill:#c93030}.small{font-size:18px}.note{font-size:12px;fill:#000000}.parent-label{fill:#444444}.parent{fill:#f5f5f5}.edge{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:none;stroke-opacity:1}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.gapfill{fill:#ECE5FF;stroke:none}.column-frame{fill:none;stroke:#007F99;stroke-width:1.5}.row-frame{fill:none;stroke:#D66A00;stroke-width:1.5}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><rect width="760" height="560" fill="#ffffff"/><text x="24" y="34" class="title">まず、配置に使う親の幅を見る</text><text x="452" y="63" class="note">※ 灰色の線はborderではなく、</text><text x="452" y="81" class="note">親の範囲を示す補助線です。</text><text x="24" y="100" class="code" xml:space="preserve">.parent {</text><text x="24" y="125" class="code active" xml:space="preserve">  display: grid;</text><text x="24" y="150" class="code" xml:space="preserve">}</text><text x="76" y="220" class="parent-label">外側で使える幅：460px</text><rect x="76" y="290" width="460" height="150" class="parent "/><path class="edge" d="M73.25,440 V287.25 H538.75 V440"/><line x1="76" y1="272" x2="536" y2="272" stroke="#000000" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="306" y="262" class="small" text-anchor="middle" fill="#000000" style="fill:#000000">親の内容幅 460px</text><text x="94" y="330" class="parent-label">.parent</text><text x="94" y="369" class="small">中身と高さは、この後で見る。</text></svg>

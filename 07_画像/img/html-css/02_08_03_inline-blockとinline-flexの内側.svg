<text x="283" y="243" font-size="17" fill="#000000" font-weight="400" text-anchor="middle">詳しく見る</text>
<line x1="81" y1="262" x2="401" y2="262" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5"/>

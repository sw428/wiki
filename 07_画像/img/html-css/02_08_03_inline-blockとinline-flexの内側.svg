<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388.26" viewBox="0 0 920 470" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図② 同じ中身でも、配置ルールが違う</title><desc id="desc">inline-blockでは画像とspanが通常の行に参加し、inline-flexでは直接の子がFlexアイテムとなり、centerとgapで配置される。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="470" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">図② 同じ中身でも、配置ルールが違う</text>

<text x="56" y="114" font-size="19" fill="#193B64" font-weight="700">inline-block：通常の行内配置</text>
<rect x="468" y="76" width="420" height="330" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="492" y="114" font-size="19" fill="#193B64" font-weight="700">inline-flex：Flexアイテム</text>

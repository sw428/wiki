<svg xmlns="http://www.w3.org/2000/svg" width="440" height="594" viewBox="0 0 440 594" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図② inline-blockとinline-flexの中身の違い</title><desc id="desc">同じHTMLのimgとspan。inline-blockでは二つが通常の行内配置に参加し、inline-flexでは直接の子がFlexアイテムになる。gapとalign-itemsを追加すると間隔と縦位置を管理できる。</desc><style>
text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;fill:#000000}
.head{font-size:20px;font-weight:700}
.sub{font-size:18px;font-weight:700}
.copy{font-size:16.5px}
.small{font-size:14px}
.mono{font-family:Consolas,monospace;font-size:16px}
.parent{fill:#f5f5f5;stroke:#666666;stroke-width:2}
.blue{fill:#cfe4ff;stroke:#315fa0;stroke-width:2}
.red{fill:#f8cfd6;stroke:#c93030;stroke-width:2}
.green{fill:#cae6d1;stroke:none}
.purple{fill:#ece5ff;stroke:none}
.blue-label{fill:#315fa0;font-weight:700}
.red-label{fill:#c93030;font-weight:700}
.green-label{fill:#26724a;font-weight:700}
.purple-label{fill:#7c3aed;font-weight:700}
.code-red{fill:#c93030;font-weight:700}
.note{font-size:13px;fill:#444444}
</style><rect width="440" height="594" fill="#ffffff"/>
<text x="20" y="34" class="head">図② 同じHTML、異なる内側の配置</text>
<text x="21" y="72" class="sub">A：inline-block</text>
<text x="22" y="100" class="mono"><tspan class="code-red">display: inline-block;</tspan></text>
<rect x="20" y="118" width="400" height="160" rx="8" class="parent"/>
<text x="36" y="142" class="small">通常の文字の行で並ぶ</text>
<rect x="43" y="163" width="82" height="78" rx="4" class="blue"/>
<text x="84" y="209" class="copy" text-anchor="middle">img</text>
<rect x="150" y="197" width="232" height="44" rx="4" class="red"/>
<text x="266" y="225" class="copy" text-anchor="middle">span：詳しく見る</text>
<path d="M36 241 H398" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
<text x="41" y="262" class="small purple-label">行のベースライン（模式）</text>
<text x="23" y="299" class="small">画像と文字が同じ行の規則で配置される</text>
<path d="M220 310 V341" stroke="#8ea2b9" stroke-width="2"/>
<path d="M214 334 L220 342 L226 334" fill="none" stroke="#8ea2b9" stroke-width="2"/>
<text x="21" y="374" class="sub">B：inline-flex</text>
<text x="22" y="402" class="mono"><tspan class="code-red">display: inline-flex;</tspan></text>
<text x="22" y="425" class="mono"><tspan class="code-red">align-items: center; gap: 10px;</tspan></text>
<rect x="20" y="443" width="400" height="121" rx="8" class="parent"/>
<rect x="42" y="471" width="82" height="67" rx="4" class="blue"/>
<text x="83" y="511" class="copy" text-anchor="middle">img</text>
<rect x="124" y="471" width="27" height="67" class="purple"/>
<text x="137.5" y="463" class="small purple-label" text-anchor="middle">gap</text>
<rect x="151" y="482" width="230" height="45" rx="4" class="red"/>
<text x="266" y="510" class="copy" text-anchor="middle">span：詳しく見る</text>
<path d="M34 505 H42 M124 505 H151 M381 505 H402" stroke="#26724a" stroke-width="2" stroke-dasharray="5 5"/>
<text x="31" y="555" class="small green-label">各アイテムの縦中心を揃える</text>
<text x="20" y="587" class="note">※ 仕組みを説明する模式図。実寸・文字位置はフォントで変わります。</text>
</svg>
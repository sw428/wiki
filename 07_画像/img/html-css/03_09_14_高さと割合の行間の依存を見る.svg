<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">高さと割合の行間が、互いの結果を必要とする</title><desc id="desc">内容から親の高さを求めるには行高と行間が必要。一方、割合の行間を求めるには親の高さが必要となる。二つの結果が互いに依存する関係を示す。</desc><metadata id="grid-data">{&quot;type&quot;:&quot;dependency&quot;,&quot;rowGap&quot;:&quot;5%&quot;,&quot;height&quot;:&quot;auto&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M7,1 L1,4 L7,7" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:24px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.active{fill:#c93030}.small{font-size:18px}.note{font-size:12px;fill:#000000}.parent-label{fill:#444444}.parent{fill:#f5f5f5}.edge{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:none;stroke-opacity:1}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.gapfill{fill:#ECE5FF;stroke:none}.column-frame{fill:none;stroke:#007F99;stroke-width:1.5}.row-frame{fill:none;stroke:#D66A00;stroke-width:1.5}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><rect width="760" height="560" fill="#ffffff"/><text x="24" y="34" class="title">高さと割合の行間が、互いの結果を必要とする</text><text x="452" y="63" class="note">※ 灰色の線はborderではなく、</text><text x="452" y="81" class="note">親の範囲を示す補助線です。</text><text x="24" y="100" class="code" xml:space="preserve">.parent {</text><text x="24" y="125" class="code" xml:space="preserve">  column-gap: 5%;</text><text x="24" y="150" class="code active" xml:space="preserve">  row-gap: 5%;</text><text x="24" y="175" class="code" xml:space="preserve">}</text><defs><marker id="relation" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#000000" stroke-width="1.2"/></marker></defs><text x="380" y="220" class="small" text-anchor="middle">行間の計算に、高さが必要</text><path d="M190,275 V250 H550 V275" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#relation)"/><text x="190" y="307" class="parent-label" text-anchor="middle">親の高さ</text><text x="190" y="345" class="small" text-anchor="middle">行高と行間から求める</text><text x="550" y="307" class="gap" text-anchor="middle">割合の行間</text><text x="550" y="345" class="small" text-anchor="middle">親の高さの5%を使う</text><path d="M550,370 V410 H190 V370" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#relation)"/><text x="380" y="450" class="small" text-anchor="middle">親の高さの計算に、行間が必要</text><text x="76" y="520" class="small">どちらを求めるにも、もう一方の結果が必要になる。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="391.57" viewBox="0 0 920 474" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図③ 画像の下の空間は、内側か外側か</title><desc id="desc">Aはインライン画像の下端が行のベースラインに揃い、行の下側に空間が残る。Bはimgと文字を入れたinline-flexで、内側の画像由来の隙間は避けても部品全体は外側の文章の行に参加する。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="474" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">図③ 画像の下の空間は、内側か外側か</text>
<rect x="32" y="78" width="423" height="326" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="56" y="116" font-size="19" fill="#193B64" font-weight="700">A：画像一枚を囲む箱</text>
<rect x="470" y="78" width="420" height="326" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="494" y="116" font-size="19" fill="#193B64" font-weight="700">B：画像＋文字のinline-flex</text>
<rect x="75" y="154" width="338" height="190" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="110" y="180" width="269" height="120" rx="6" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="243" y="250" font-size="18" fill="#25384F" font-weight="600" text-anchor="middle">img（インライン）</text>
<line x1="95" y1="301" x2="394" y2="301" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="95" y="305" width="299" height="24" rx="0" fill="#f9cc9d" stroke="none" stroke-width="1"/>
<text x="240" y="322" font-size="15" fill="#793A00" font-weight="600" text-anchor="middle">行の下側の空間</text>
<rect x="505" y="154" width="349" height="190" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<text x="520" y="223" font-size="15" fill="#25384F" font-weight="400">前の文字</text>
<rect x="587" y="180" width="188" height="100" rx="6" fill="#ffffff" stroke="#315fa0" stroke-width="2"/>
<rect x="598" y="206" width="60" height="57" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="628" y="242" font-size="14" fill="#000000" font-weight="400" text-anchor="middle">img</text>
<rect x="673" y="211" width="91" height="45" rx="4" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="718" y="238" font-size="15" fill="#000000" font-weight="400" text-anchor="middle">文字</text>
<text x="782" y="223" font-size="15" fill="#25384F" font-weight="400">後の文字</text>
<line x1="519" y1="284" x2="841" y2="284" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/>
<text x="535" y="324" font-size="15" fill="#25384F" font-weight="400">外側の文章の行の基準線（模式）</text>
<text x="36" y="447" font-size="16" fill="#000000" font-weight="400">※ 灰色の枠は親の範囲を示す補助線で、実際のCSSのborderではありません。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="329.33" viewBox="0 0 900 390" role="img" aria-labelledby="title desc" style="max-width:100%">
<title id="title">見出し内の画像は行ボックスに入る</title>
<desc id="desc">ブロックのh2の内側に行ボックスが形成され、インライン画像はその行に配置される。画像の下には行ボックスに由来する空間が残り得ることを示した模式図。</desc>
<rect width="100%" height="100%" rx="14" fill="#FCFDFE"/>
<style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;fill:#000000}.head{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:20px}.note{font-size:17px}.parent-label{fill:#444444;font-size:21px;font-weight:700}.blue{fill:#315fa0}.red{fill:#c93030}.green{fill:#26724a}.purple{fill:#7C3AED}</style>
<text x="45" y="46" class="head">親がblockでも、画像は行の中に置かれる</text>
<rect x="160" y="89" width="580" height="245" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
<text x="183" y="120" class="parent-label">h2（ブロックの箱）</text>
<rect x="207" y="146" width="486" height="154" rx="7" fill="#ffffff" stroke="#7C3AED" stroke-dasharray="7 5" stroke-width="2"/>
<text x="228" y="175" class="body purple">行ボックス</text>
<rect x="285" y="190" width="330" height="71" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="450" y="234" class="label blue" text-anchor="middle">img（インライン画像）</text>
<line x1="225" y1="261" x2="675" y2="261" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="286" y="268" width="330" height="23" rx="2" fill="#eeeeee"/>
<text x="450" y="287" text-anchor="middle" class="note">行の下側に空間が残る場合がある</text>
<text x="45" y="367" class="note">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text>
</svg>

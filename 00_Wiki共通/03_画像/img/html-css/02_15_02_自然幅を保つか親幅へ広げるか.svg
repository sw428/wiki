<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375.04" viewBox="0 0 920 454" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">同じ自然比率でも、画像を拡大するかは別</title><desc id="desc">自然幅240pxの画像を内容幅480pxの親に入れる。max-width 100%だけなら自然幅240pxのまま、width 100%なら480pxへ拡大する。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="454" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">同じ自然比率でも、画像を拡大するかは別</text>
<rect x="28" y="80" width="426" height="316" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="52" y="118" font-size="19" fill="#193B64" font-weight="700">① max-width: 100%</text>
<rect x="469" y="80" width="424" height="316" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="493" y="118" font-size="19" fill="#193B64" font-weight="700">② width: 100%</text>
<rect x="57" y="143" width="364" height="192" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="498" y="143" width="363" height="192" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<text x="66" y="165" font-size="18" fill="#444444" font-weight="400">親：480px</text>
<text x="506" y="165" font-size="18" fill="#444444" font-weight="400">親：480px</text>
<rect x="66" y="196" width="190" height="97" rx="5" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<rect x="507" y="196" width="340" height="97" rx="5" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="161" y="250" font-size="21" fill="#000000" font-weight="400" text-anchor="middle">画像</text>
<text x="677" y="250" font-size="21" fill="#000000" font-weight="400" text-anchor="middle">画像</text>
<text x="72" y="326" font-size="17" fill="#007F99" font-weight="400">表示幅：240px（自然幅のまま）</text>
<text x="516" y="326" font-size="17" fill="#007F99" font-weight="400">表示幅：480px（親幅まで拡大）</text>
<text x="30" y="429" font-size="17" fill="#25384F" font-weight="400">どちらも height: auto なら画像自身の縦横比を保つ。</text></svg>
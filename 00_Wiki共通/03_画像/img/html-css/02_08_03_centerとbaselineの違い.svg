<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375.04" viewBox="0 0 920 454" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">図④ 中央揃えとベースライン揃え</title><desc id="desc">Flexのalign-items centerではアイテムの箱の中央、baselineでは子のベースラインを基準に揃える。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="454" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="34" y="48" font-size="24" fill="#000000" font-weight="700">図④ 中央揃えとベースライン揃え</text>
<rect x="32" y="77" width="420" height="310" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="56" y="115" font-size="19" fill="#193B64" font-weight="700">align-items: center</text>
<rect x="468" y="77" width="420" height="310" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="492" y="115" font-size="19" fill="#193B64" font-weight="700">align-items: baseline</text>
<rect x="74" y="142" width="335" height="154" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="510" y="142" width="335" height="154" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<line x1="92" y1="219" x2="391" y2="219" stroke="#007F99" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="108" y="179" width="80" height="80" rx="5" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="148" y="224" font-size="17" fill="#000000" font-weight="400" text-anchor="middle">icon</text>
<rect x="216" y="201" width="168" height="36" rx="5" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="300" y="225" font-size="17" fill="#000000" font-weight="400" text-anchor="middle">文字</text>
<text x="83" y="330" font-size="16" fill="#000000" font-weight="400">箱の縦方向の中心を揃える</text>
<line x1="524" y1="259" x2="829" y2="259" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="546" y="180" width="78" height="79" rx="5" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="585" y="227" font-size="17" fill="#000000" font-weight="400" text-anchor="middle">icon</text>
<rect x="655" y="208" width="167" height="68" rx="5" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="738" y="259" font-size="17" fill="#000000" font-weight="400" text-anchor="middle">文字</text>
<text x="519" y="330" font-size="16" fill="#000000" font-weight="400">文字などのベースラインを基準にする</text>
<text x="35" y="429" font-size="16" fill="#000000" font-weight="400">※ ベースラインの位置は、フォント・画像・要素の条件によって変わります。</text></svg>
<rect x="32" y="78" width="420" height="370" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="56" y="116" font-size="19" fill="#193B64" font-weight="700">① 折り返せず、はみ出す</text>
<rect x="468" y="78" width="420" height="370" rx="12" fill="#ffffff" stroke="#DCE4EE" stroke-width="2"/>
<text x="492" y="116" font-size="19" fill="#193B64" font-weight="700">② overflow-wrap: anywhere</text>
<rect x="60" y="153" width="345" height="243" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="496" y="153" width="345" height="243" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="2"/>
<rect x="80" y="204" width="144" height="130" rx="0" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>

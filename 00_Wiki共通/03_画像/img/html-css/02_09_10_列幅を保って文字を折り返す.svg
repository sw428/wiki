<rect x="516" y="204" width="144" height="130" rx="0" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<rect x="678" y="204" width="144" height="130" rx="0" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<rect x="224" y="204" width="18" height="130" rx="0" fill="#ECE5FF" stroke="none" stroke-width="1"/>
<rect x="660" y="204" width="18" height="130" rx="0" fill="#ECE5FF" stroke="none" stroke-width="1"/>
<text x="87" y="248" font-size="16" fill="#000000" font-weight="400">ABCDEFGHIJKL</text>

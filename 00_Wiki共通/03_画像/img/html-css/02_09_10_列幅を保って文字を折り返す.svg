<svg xmlns="http://www.w3.org/2000/svg" width="760" height="417.17" viewBox="0 0 920 505" role="img" aria-labelledby="title desc" style="max-width:100%"><title id="title">列は同じまま、文字だけを折り返す</title><desc id="desc">各240pxの2列と30pxのgapは同じ。左列の長い一続きの文字へoverflow-wrap anywhereを加えると、文字だけが複数行になる。</desc><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;dominant-baseline:auto}.mono{font-family:Consolas,'Noto Sans Mono',monospace}</style><rect x="0" y="0" width="920" height="505" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>

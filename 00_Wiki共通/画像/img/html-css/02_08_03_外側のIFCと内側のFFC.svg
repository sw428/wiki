<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312.7083333333333" style="max-width:100%;height:auto" viewBox="0 0 960 395" role="img" aria-labelledby="title desc">
<title id="title">外側のIFCと内側のFFC</title>
<desc id="desc">親のIFCの行に置くinline-flexの箱と、その内側でFlexアイテムとして並ぶ画像と文字を示す。</desc>
<rect x="0" y="0" width="960" height="395" rx="16" fill="#FCFDFE"/>
<style>
 text { font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif; fill:#000000; }
 .title {font-size:22px;font-weight:700;} .label {font-size:17px;font-weight:700;}
 .body {font-size:17px;} .small {font-size:16px;} .tiny {font-size:15px;}
 .muted,.blue,.green,.orange {fill:#000000;}
 .line {stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;}
</style>
<text x="35" y="44" class="title" >① 外側はIFCに参加／内側はFFCを形成</text>
<rect x="40" y="71" width="880" height="269" rx="13" fill="#f5f5f5" stroke="#666666" stroke-width="2" />
<text x="68" y="105" class="label" style="fill:#444444" >親のIFC：インラインレベルの箱を一行に並べる</text>
<text x="75" y="245" class="body" >前の文字</text>
<rect x="188" y="135" width="552" height="152" rx="11" fill="#f5f5f5" stroke="#666666" stroke-width="2" />
<text x="214" y="168" class="label" style="fill:#444444" >inline-flex 自身（外側はインラインレベル）</text>
<rect x="218" y="188" width="192" height="57" rx="7" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.8" />
<text x="314" y="222" class="body" text-anchor="middle">画像 / Flex item</text>
<rect x="430" y="188" width="280" height="57" rx="7" fill="#f8cfd6" stroke="#c93030" stroke-width="1.8" />
<text x="570" y="222" class="body" text-anchor="middle">文字 / Flex item</text>
<text x="765" y="245" class="body" >後の文字</text>
<line x1="72" y1="279" x2="891" y2="279" class="line"/>
<text x="600" y="309" class="small orange" >親の行のベースライン（模式位置）</text>
<text x="922" y="62" text-anchor="end" style="font-size:12px;fill:#000000">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">列間の割合は、親の内容幅が基準</title><desc id="desc">親の内容幅460pxは外側から求められる。column-gapの5%は23pxとなり、残りを2列で分けると各218.5pxになる。行間は20pxのまま。</desc><metadata id="grid-data">{&quot;type&quot;:&quot;static&quot;,&quot;width&quot;:460,&quot;columns&quot;:[218.5,218.5],&quot;rows&quot;:[40,80,40],&quot;gx&quot;:23,&quot;gy&quot;:20,&quot;height&quot;:200}</metadata><defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M7,1 L1,4 L7,7" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:24px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.active{fill:#c93030}.small{font-size:18px}.note{font-size:12px;fill:#000000}.parent-label{fill:#444444}.parent{fill:#f5f5f5}.edge{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:none;stroke-opacity:1}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.gapfill{fill:#ECE5FF;stroke:none}.column-frame{fill:none;stroke:#007F99;stroke-width:1.5}.row-frame{fill:none;stroke:#D66A00;stroke-width:1.5}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><rect width="760" height="560" fill="#ffffff"/><text x="24" y="34" class="title">列間の割合は、親の内容幅が基準</text><text x="452" y="63" class="note">※ 灰色の線はborderではなく、</text><text x="452" y="81" class="note">親の範囲を示す補助線です。</text><text x="24" y="100" class="code" xml:space="preserve">.parent {</text><text x="24" y="125" class="code active" xml:space="preserve">  column-gap: 5%;</text><text x="24" y="150" class="code" xml:space="preserve">  row-gap: 20px;</text><text x="24" y="175" class="code" xml:space="preserve">}</text><text x="76" y="238" class="parent-label">親の内容幅：460px</text><rect x="76" y="290" width="460" height="200" class="parent "/><rect x="294.5" y="290" width="23" height="200" class="gapfill"/><rect x="76" y="290" width="218.5" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" data-child="A"/><text x="88" y="317" style="fill:#315fa0">A</text><rect x="317.5" y="290" width="218.5" height="40" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" data-child="B"/><text x="329.5" y="317" style="fill:#c93030">B</text><rect x="76" y="330" width="460" height="20" class="gapfill"/><rect x="76" y="350" width="218.5" height="80" fill="#f3dcf7" stroke="#a21caf" stroke-width="1.5" data-child="C"/><text x="88" y="377" style="fill:#a21caf">C</text><text x="88" y="417" style="fill:#a21caf">続き</text><rect x="317.5" y="350" width="218.5" height="80" fill="#fbe0eb" stroke="#be185d" stroke-width="1.5" data-child="D"/><text x="329.5" y="377" style="fill:#be185d">D</text><rect x="76" y="430" width="460" height="20" class="gapfill"/><rect x="76" y="450" width="218.5" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" data-child="E"/><text x="88" y="477" style="fill:#315fa0">E</text><rect x="317.5" y="450" width="218.5" height="40" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" data-child="F"/><text x="329.5" y="477" style="fill:#c93030">F</text><rect x="73.25" y="287.25" width="465.5" height="205.5" class="edge " data-outline-gap="1"/><text x="570" y="318" class="column">列幅</text><text x="570" y="354" class="column">各218.5px</text><text x="570" y="400" class="gap">列間</text><text x="570" y="436" class="gap">5% = 23px</text><text x="76" y="529" class="small">行高・行間は変えていない。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="title desc">
  <title id="title">imgタグ・ブラウザエンジン・置換要素の関係</title>
  <desc id="desc">HTMLタグのimgからブラウザエンジンが要素を認識し、通常は置換要素としてレイアウトするまでの流れを示す。</desc>
  <rect x="0" y="0" width="840" height="620" fill="#FFFFFF"/>
  <!-- 01 HTMLタグ -->
  <g id="step-html">
    <rect x="52" y="34" width="736" height="144" rx="10" fill="#F3F4F6" />
    <text x="420" y="93" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111827">HTMLタグ：&lt;img&gt;</text>
    <text x="420" y="137" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#64748B">タグ名・src・width・heightなど</text>
  </g>
  <!-- 矢印: HTML からエンジン -->
  <g id="arrow-html-engine" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 188 V219"/>
    <path d="M409 208 L420 220 L431 208"/>
  </g>
  <!-- 02 ブラウザエンジン -->
  <g id="step-browser-engine">
    <rect x="52" y="235" width="736" height="155" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="2" />
    <text x="420" y="284" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111827">ブラウザエンジン</text>
    <text x="420" y="331" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111827">img要素として認識する</text>
    <text x="420" y="366" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#64748B">DOMではHTMLImageElementなどを使用</text>
  </g>
  <!-- 矢印: エンジンから置換要素 -->
  <g id="arrow-engine-layout" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 402 V433" />
    <path d="M409 422 L420 434 L431 422" />
  </g>
  <!-- 03 置換要素の処理 -->
  <g id="step-replaced-element">
    <rect x="52" y="449" width="736" height="137" rx="10" fill="#EEF8FC" stroke="#D9DEE5" stroke-width="2" />
    <text x="420" y="502" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111827">通常は置換要素としてレイアウト</text>
    <text x="420" y="548" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#64748B">画像の固有寸法・CSS・親要素の制約を利用</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" role="img" aria-labelledby="title desc">
<title id="title">前の要素のmargin-bottomで親の開始位置を確認する</title>
<desc id="desc">前の要素の下端を基準の0pxとし、margin-bottom: 250pxをオレンジの領域で示す。その先で親要素が始まり、親の上端は250pxになる。通常フローのブロック配置で、ほかのmarginやborder、位置指定がこの距離に影響しない例。子の位置はこの図には示していない。縦の距離はCSSの1pxを図の0.8単位で示し、箱の大きさは模式的で親の下側は省略する。灰色の点線は親の範囲を示す補助線で、実際のCSSのborderではない。</desc>
<defs>
<marker id="black" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#111111" stroke-width="2"/>
</marker>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#315fa0" stroke-width="2"/>
</marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#26724a" stroke-width="2"/>
</marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c93030" stroke-width="2"/>
</marker>
</defs>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<rect x="0" y="0" width="980" height="820" fill="#ffffff" />
<rect x="30" y="20" width="920" height="94" fill="#f1f5f9" />
<text x="52" y="61" font-size="35" font-weight="700" text-anchor="start" fill="#111111">① 前の要素のmargin-bottom</text>
<text x="52" y="96" font-size="25" font-weight="400" text-anchor="start" fill="#315fa0">.before { margin-bottom: 250px; }</text>
<rect x="180" y="140" width="400" height="80" fill="#cfe4ff" stroke="#315fa0" stroke-width="2" />
<text x="380" y="190" font-size="29" font-weight="700" text-anchor="middle" fill="#315fa0">前の要素 .before</text>
<rect x="180" y="220" width="400" height="200" fill="#f9cc9d" />
<rect x="180" y="420" width="400" height="280" fill="#f5f5f5" />
<line x1="180" y1="420" x2="580" y2="420" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="180" y1="420" x2="180" y2="700" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="580" y1="420" x2="580" y2="700" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<text x="380" y="664" font-size="27" fill="#444444" font-weight="700" text-anchor="middle">親要素 .parent</text>
<text x="380" y="693" font-size="20" font-weight="400" text-anchor="middle" fill="#111111">↓ 下へ続く</text>
<line x1="165" y1="220" x2="615" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
<text style="fill:#111111" x="710" y="227" font-size="22" fill="#111111" font-weight="400" text-anchor="start">前の要素の下端：0px</text>
<text x="710" y="427" font-size="22" fill="#444444" font-weight="400" text-anchor="start">親の上端：250px</text>
<text x="380" y="328" font-size="25" fill="#315fa0" font-weight="600" text-anchor="middle">margin-bottom: 250px</text>
<text x="380" y="546" font-size="25" font-weight="400" text-anchor="middle" fill="#111111">親の開始位置を確認</text>
<rect x="30" y="716" width="920" height="53" fill="#f1f5f9" />
<text x="490" y="753" font-size="31" fill="#111111" font-weight="700" text-anchor="middle" style="fill:#111111">0 + 250 = 250px</text>
<text style="fill:#111111" x="40" y="798" font-size="20" fill="#111111" font-weight="400" text-anchor="start">点線は親の補助線で、CSSのborderではありません。図は模式図です。</text>
</g>
</svg>

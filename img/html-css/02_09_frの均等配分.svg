<svg xmlns="http://www.w3.org/2000/svg" id="minmax-ratio-explanation" width="736" height="232" viewBox="0 0 736 232" role="img" aria-labelledby="title desc"><title id="title">10frずつでも1frずつでも、等分する結果は同じ</title><desc id="desc">親の内容幅612px、gap0、空の子を3つ置いた比較。各列をminmax(0,10fr)とした場合もminmax(0,1fr)とした場合も、3列はそれぞれ204pxになる。色は左から青、赤、紫で両方の図に共通。点線は親の範囲を示す説明用の補助線。</desc><style>
    #minmax-ratio-explanation { color: var(--foreground); }
    #minmax-ratio-explanation .diagram { display: block; width: 100%; background: #ffffff; }
    #minmax-ratio-explanation .key { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
    #minmax-ratio-explanation text { fill: #111111; font-family: sans-serif; font-size: 14px; }
    #minmax-ratio-explanation .parent { fill: #f5f5f5; stroke: #666666; stroke-width: 2; stroke-dasharray: 8 7; }
  </style><rect width="736" height="232" fill="#ffffff"/><g><text x="16" y="27">10fr : 10fr : 10fr</text><rect x="16" y="42" width="704" height="50" class="parent"></rect><rect x="16" y="45" width="234.66666666666666" height="44" fill="#cfe4ff" stroke="#315fa0"></rect><text x="133.33333333333331" y="71" text-anchor="middle">204px</text><rect x="250.66666666666666" y="45" width="234.66666666666666" height="44" fill="#f8cfd6" stroke="#c93030"></rect><text x="368" y="71" text-anchor="middle">204px</text><rect x="485.3333333333333" y="45" width="234.66666666666666" height="44" fill="#e9ddff" stroke="#7c3aed"></rect><text x="602.6666666666666" y="71" text-anchor="middle">204px</text><text x="16" y="127">1fr : 1fr : 1fr</text><rect x="16" y="142" width="704" height="50" class="parent"></rect><rect x="16" y="145" width="234.66666666666666" height="44" fill="#cfe4ff" stroke="#315fa0"></rect><text x="133.33333333333331" y="171" text-anchor="middle">204px</text><rect x="250.66666666666666" y="145" width="234.66666666666666" height="44" fill="#f8cfd6" stroke="#c93030"></rect><text x="368" y="171" text-anchor="middle">204px</text><rect x="485.3333333333333" y="145" width="234.66666666666666" height="44" fill="#e9ddff" stroke="#7c3aed"></rect><text x="602.6666666666666" y="171" text-anchor="middle">204px</text><text x="16" y="222">どちらも、同じ幅を3列へ等分</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="436" viewBox="0 222 340 218" role="img" aria-labelledby="title desc">
<title id="title">② Flex・Grid（相殺しない）</title>
<desc id="desc">親の20pxと子の40pxの上marginが別々に作用し、前の要素から子の上端まで60pxになる。 灰色の点線は説明用補助線で、CSSのborderではない。前の要素のmarginは0。模式図。</desc>
<defs>
  <!-- 文字・数値の下だけ補助線を隠し、領域の背景は保つ。 -->
  <mask id="guide-gap-1" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="222" width="340" height="218" style="mask-type:luminance">
    <rect x="0" y="222" width="340" height="218" fill="#ffffff"/>
    <rect x="140" y="287" width="82" height="23" fill="#000000"/>
  </mask>
  <mask id="guide-gap-2" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="222" width="340" height="218" style="mask-type:luminance">
    <rect x="0" y="222" width="340" height="218" fill="#ffffff"/>
    <rect x="140" y="287" width="82" height="23" fill="#000000"/>
  </mask>
</defs>
<rect x="0" y="222" width="340" height="218" fill="#ffffff"/>
<style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; }
  </style>
<text x="12" y="239" font-size="14" font-weight="bold" fill="#222222">② Flex・Grid（相殺しない）</text>
  <rect x="60" y="250" width="242" height="38" fill="#cfe4ff" stroke="#315fa0"/>
  <text x="181" y="274" text-anchor="middle" font-size="12" fill="#222222">前の要素</text>
  <rect x="60" y="288" width="242" height="20" fill="#f9cc9d"/>
  <text x="181" y="302" text-anchor="middle" font-size="11" fill="#8A581B" style="fill: #444444">親margin 20px</text>
  <rect x="60" y="308" width="242" height="119" fill="#f5f5f5"/>
  <rect x="60" y="308" width="242" height="119" fill="none" stroke="#666666" stroke-dasharray="8 7" stroke-width="2" mask="url(#guide-gap-1)"/>
  <line x1="60" y1="308" x2="302" y2="308" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#guide-gap-2)"/>
  <text x="53" y="311" text-anchor="end" font-size="10" fill="#444444">上端</text>
  <rect x="78" y="309" width="206" height="40" fill="#f9cc9d"/>
  <text x="181" y="334" text-anchor="middle" font-size="12" fill="#8A581B" style="fill: #b42337">子margin 40px</text>
  <rect x="78" y="349" width="206" height="43" fill="#f8cfd6" stroke="#c93030"/>
  <text x="181" y="376" font-size="13" text-anchor="middle" fill="#222222">子要素</text>
  <text x="181" y="417" font-size="12" text-anchor="middle" fill="#444444">親要素</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="736" height="354" viewBox="0 0 736 354" role="img" aria-labelledby="title desc">
<title id="title">minmaxの下限0と、列幅が0になる条件</title>
<desc id="desc">固定列192pxとgap26pxを保ち、親の内容幅を578px、314px、218pxへ狭める比較。可変列minmax(0,1fr)は360px、96px、0pxとなる。固定列と可変列はともにシアンで示し、列幅の値で区別する。0pxは親の右端にあるシアンの補助線で示す。gapは紫。灰色の点線と色付きの外枠は説明用でCSSのborderではない。子は空でpadding・border・固定幅を加えない。</desc>
<style>text{font-family:'Yu Gothic',Meiryo,sans-serif;font-size:20px;fill:#000000}.parent{fill:#f5f5f5;stroke:#666666;stroke-width:2;stroke-dasharray:8 7}.parent-label{fill:#444444}.small{font-size:18px}.column{fill:#007F99;font-weight:700}.gap{fill:#7C3AED;font-weight:700}</style>
<rect width="736" height="354" fill="#ffffff"/>
<text x="32" y="38" class="parent-label">親の内容幅 578px</text>
<rect class="parent" x="32" y="54" width="578" height="56"/><rect x="224" y="54" width="26" height="56" fill="#ECE5FF" data-grid-gap="true"/>
<rect x="32" y="57" width="192" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="128" y="88" text-anchor="middle" class="column">192px</text>
<rect x="250" y="57" width="360" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="430" y="88" text-anchor="middle" class="column">360px</text>
<text x="32" y="134" class="parent-label">親の内容幅 314px</text>
<rect class="parent" x="32" y="150" width="314" height="56"/><rect x="224" y="150" width="26" height="56" fill="#ECE5FF" data-grid-gap="true"/>
<rect x="32" y="153" width="192" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="128" y="184" text-anchor="middle" class="column">192px</text>
<rect x="250" y="153" width="96" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="298" y="184" text-anchor="middle" class="column">96px</text>
<text x="32" y="230" class="parent-label">親の内容幅 218px</text>
<rect class="parent" x="32" y="246" width="218" height="56"/><rect x="224" y="246" width="26" height="56" fill="#ECE5FF" data-grid-gap="true"/>
<rect x="32" y="249" width="192" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="128" y="280" text-anchor="middle" class="column">192px</text>
<line x1="250" y1="243" x2="250" y2="305" stroke="#007F99" data-grid-column="zero" stroke-width="2"/>
<text x="264" y="280" class="column">可変列 0px</text>
<text x="32" y="336" class="small"><tspan class="column">固定列192px</tspan>・<tspan class="gap">gap26px</tspan>は共通</text>
</svg>

<text x="730" y="650" font-size="23" text-anchor="middle" font-weight="700" fill="#be185d">子D .d</text>
<line x1="835" y1="586" x2="855" y2="586" stroke="#111111" stroke-width="1.5"/>
<text x="872" y="593" font-size="21" fill="#111111" >Y = 426px</text>
<line x1="1070" y1="160" x2="1070" y2="586" stroke="#111111" stroke-width="1.5" marker-start="url(#measure)" marker-end="url(#measure)"/>
<text x="1098" y="373" font-size="19" fill="#111111" text-anchor="middle" transform="rotate(-90 1098 373)">A → D：426px</text>
<text x="575" y="746" font-size="25" fill="#111111" text-anchor="middle" font-weight="700">Y(D) = 112 × 3 + 23 + 39 + 28 = 426px</text>
<text style="fill:#111111" x="575" y="789" font-size="18" fill="#111111" text-anchor="middle">オレンジ＝相殺後のmargin　灰色の点線＝親の範囲</text>

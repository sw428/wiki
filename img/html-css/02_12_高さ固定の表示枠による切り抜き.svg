<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
<title id="title">高さ固定の表示枠で元画像の左右・上下を切り取る例</title>
<desc id="desc">高さをそろえた青い表示枠とobject-fit: coverによる切り抜きを、二つの元画像で比較する模式図。左は元画像が表示枠より横長なので左右、右は元画像が表示枠より縦長なので上下の灰色部分が枠の外へ隠れる。両方ともA・C・D・Fが隠れ、中央のB・丸・Eが表示枠内に残る。下向きの矢印の先に、残る内容を縮小した最終表示を示す。枠線と格子は説明用の補助線で、実際のCSSのborderではない。</desc>
<style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#444444}.title{font-size:29px;font-weight:700;fill:#222222}.heading{font-size:25px;font-weight:700;fill:#222222}.sub{font-size:19px}.caption{font-size:19px}.letters{font-size:20px;font-weight:500}.grid{fill:none;stroke:#d5d5d5;stroke-width:1.5}.source{fill:none;stroke:#999999;stroke-width:2}.frame{fill:none;stroke:#315fa0;stroke-width:3}.tag{font-size:17px;fill:#ffffff;font-weight:700}</style>
<defs>
<g id="wide">
<rect width="350" height="180" fill="#ffffff"/>
<path d="M116.666667 0V180M233.333333 0V180M0 90H350" class="grid"/>
<circle cx="175" cy="90" r="35" fill="#aaaaaa"/>
<g class="letters">
<text x="16" y="24">A</text>
<text x="175" y="24" text-anchor="middle">B</text>
<text x="334" y="24" text-anchor="end">C</text>
<text x="16" y="166">D</text>
<text x="175" y="166" text-anchor="middle">E</text>
<text x="334" y="166" text-anchor="end">F</text>
</g>
</g>
<g id="tall">
<rect width="210" height="350" fill="#ffffff"/>
<path d="M70 0V350M140 0V350M0 70H210M0 140H210M0 210H210M0 280H210" class="grid"/>
<circle cx="105" cy="175" r="35" fill="#aaaaaa"/>
<g class="letters">
<text x="16" y="24">A</text>
<text x="194" y="24" text-anchor="end">C</text>
<text x="105" y="109" text-anchor="middle">B</text>
<text x="105" y="251" text-anchor="middle">E</text>
<text x="16" y="336">D</text>
<text x="194" y="336" text-anchor="end">F</text>
</g>
</g>
<clipPath id="wide-result">
<rect x="225" y="650" width="70" height="108"/>
</clipPath>
<clipPath id="tall-result">
<rect x="677" y="650" width="126" height="108"/>
</clipPath>
</defs>
<rect width="1000" height="850" fill="#ffffff"/>
<text style="fill:#111111" fill="#111111" x="500" y="51" class="title" text-anchor="middle">高さ固定の表示枠で切り取る例</text>
<text x="500" y="86" class="sub" text-anchor="middle" fill="#111111" style="fill:#111111">object-fit: cover ／ 高さ固定の枠</text>
<rect x="40" y="125" width="440" height="690" rx="10" fill="#f5f5f5" stroke="#dddddd"/>
<rect x="520" y="125" width="440" height="690" rx="10" fill="#f5f5f5" stroke="#dddddd"/>
<rect x="55" y="140" width="410" height="43" rx="9" fill="#cfe4ff"/>
<rect x="535" y="140" width="410" height="43" rx="9" fill="#cfe4ff"/>
<text style="fill:#111111" fill="#111111" x="260" y="170" class="heading" text-anchor="middle">左右が切り取られる</text>
<text style="fill:#111111" fill="#111111" x="740" y="170" class="heading" text-anchor="middle">上下が切り取られる</text>
<text x="260" y="208" class="sub" text-anchor="middle" fill="#111111" style="fill:#111111">元画像が表示枠より横長</text>
<text x="740" y="208" class="sub" text-anchor="middle" fill="#111111" style="fill:#111111">元画像が表示枠より縦長</text>
<use href="#wide" transform="translate(85 300)"/>
<rect x="85" y="300" width="116.666667" height="180" fill="#999999" opacity=".45"/>
<rect x="318.333333" y="300" width="116.666667" height="180" fill="#999999" opacity=".45"/>
<rect x="85" y="300" width="350" height="180" class="source"/>
<rect x="201.666667" y="300" width="116.666666" height="180" class="frame"/>
<text x="85" y="513" class="caption" fill="#111111" style="fill:#111111">元の画像（横長）</text>
<path d="M318 478L349 501" fill="none" stroke="#315fa0" stroke-width="2"/>
<rect x="349" y="488" width="116" height="56" rx="5" fill="#315fa0"/>
<text x="407" y="511" class="tag" text-anchor="middle">表示枠</text>
<text x="407" y="534" class="tag" text-anchor="middle">（高さ固定）</text>
<use href="#tall" transform="translate(635 215)"/>
<rect x="635" y="215" width="210" height="85" fill="#999999" opacity=".45"/>
<rect x="635" y="480" width="210" height="85" fill="#999999" opacity=".45"/>
<rect x="635" y="215" width="210" height="350" class="source"/>
<rect x="635" y="300" width="210" height="180" class="frame"/>
<path d="M845 395L855 417" fill="none" stroke="#315fa0" stroke-width="2"/>
<rect x="846" y="410" width="108" height="56" rx="5" fill="#315fa0"/>
<text x="900" y="433" class="tag" text-anchor="middle">表示枠</text>
<text x="900" y="456" class="tag" text-anchor="middle">（高さ固定）</text>
<text x="740" y="595" class="caption" text-anchor="middle" fill="#111111" style="fill:#111111">元の画像（縦長）</text>
<g fill="#315fa0">
<path d="M253 562H267V590H278L260 614L242 590H253Z"/>
<path d="M733 605H747V620H758L740 644L722 620H733Z"/>
</g>
<g clip-path="url(#wide-result)">
<use href="#wide" transform="translate(155 650) scale(.6)"/>
</g>
<rect x="225" y="650" width="70" height="108" fill="none" stroke="#666666" stroke-width="2"/>
<g clip-path="url(#tall-result)">
<use href="#tall" transform="translate(677 599) scale(.6)"/>
</g>
<rect x="677" y="650" width="126" height="108" fill="none" stroke="#666666" stroke-width="2"/>
<text style="fill:#111111" fill="#111111" x="260" y="791" class="heading" text-anchor="middle">最終表示</text>
<text style="fill:#111111" fill="#111111" x="740" y="791" class="heading" text-anchor="middle">最終表示</text>
</svg>

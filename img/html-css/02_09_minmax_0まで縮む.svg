<svg xmlns="http://www.w3.org/2000/svg" id="minmax-zero-explanation" width="736" height="330" viewBox="0 0 736 330" role="img" aria-labelledby="title desc"><title id="title">親を狭くすると、可変列は0pxまで縮む</title><desc id="desc">固定列176px、gap28px、可変列minmax(0,1fr)。親の内容幅604pxでは可変列400px、304pxでは100px、204pxでは0pxになる。可変列0pxは親の右端にある赤い補助線で示す。子の内容・padding・borderはない条件。灰色の点線は親の範囲を示す補助線でCSSのborderではない。</desc><style>
    #minmax-zero-explanation { color: var(--foreground); }
    #minmax-zero-explanation .diagram { display: block; width: 100%; background: #ffffff; }
    #minmax-zero-explanation .key { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
    #minmax-zero-explanation text { fill: #111111; font-family: sans-serif; font-size: 14px; }
    #minmax-zero-explanation .parent { fill: #f5f5f5; stroke: #666666; stroke-width: 2; stroke-dasharray: 8 7; }
    #minmax-zero-explanation .fixed { fill: #cfe4ff; stroke: #315fa0; }
    #minmax-zero-explanation .flexible { fill: #f8cfd6; stroke: #c93030; }
  </style><rect width="736" height="330" fill="#ffffff"/><g><text x="16" y="27">親の内容幅 604px</text><rect x="16" y="42" width="704" height="50" class="parent"></rect><rect x="16" y="45" width="205.13907284768212" height="44" class="fixed"></rect><text x="118.56953642384106" y="71" text-anchor="middle">176px</text><rect x="253.77483443708607" y="45" width="466.2251655629139" height="44" class="flexible"></rect><text x="486.887417218543" y="71" text-anchor="middle">400px</text><text x="16" y="123">親の内容幅 304px</text><rect x="16" y="138" width="354.33112582781456" height="50" class="parent"></rect><rect x="16" y="141" width="205.13907284768212" height="44" class="fixed"></rect><text x="118.56953642384106" y="167" text-anchor="middle">176px</text><rect x="253.77483443708607" y="141" width="116.55629139072848" height="44" class="flexible"></rect><text x="312.05298013245033" y="167" text-anchor="middle">100px</text><text x="16" y="219">親の内容幅 204px</text><rect x="16" y="234" width="237.77483443708607" height="50" class="parent"></rect><rect x="16" y="237" width="205.13907284768212" height="44" class="fixed"></rect><text x="118.56953642384106" y="263" text-anchor="middle">176px</text><line x1="253.77483443708607" x2="253.77483443708607" y1="231" y2="287" stroke="#c93030" stroke-width="2"></line><text x="265.77483443708604" y="263">可変列 0px</text><text x="16" y="322">点線：親の範囲　青：固定列　赤：可変列</text></g></svg>

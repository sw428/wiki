<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">右上を基準に幅は左へ、高さは下へ広がる</title>
<desc id="desc">topとrightの値を保つと上端と右端の位置が固定される。leftとbottomは未指定。①の黒いL字の補助線は固定する上端と右端を示す。赤い丸は箱の右上で、幅は左へ、高さは下へ広がる。そこからtop 8pxで下へ、right -20pxで右へずらす。</desc>
<style>text{font-family:"Yu Gothic",Meiryo,sans-serif}</style><defs><mask id="text-clear"><rect x="0" y="0" width="1000" height="380" fill="#fff" stroke="none" /><rect x="55" y="184" width="106" height="60" fill="#000" stroke="none" /><rect x="385" y="184" width="106" height="60" fill="#000" stroke="none" /><rect x="715" y="184" width="106" height="60" fill="#000" stroke="none" /></mask></defs>
<rect x="0" y="0" width="1000" height="380" fill="#fff" stroke="none" /><defs><marker id="move" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c93030" stroke-width="1.7"/></marker></defs><text x="28" y="42" font-size="27" fill="#111111" font-weight="700">上端・右端を固定し、幅は左へ・高さは下へ</text><text x="28" y="89" font-size="24" fill="#111111" font-weight="700">① 上端・右端を固定</text><text x="28" y="119" font-size="18" fill="#444444" font-weight="400">top: 0; right: 0</text><rect x="60" y="168" width="96" height="94" fill="#f5f5f5" stroke="none" /><rect x="60" y="168" width="96" height="94" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#text-clear)"/><text x="60" y="236" font-size="42" fill="#315fa0" font-weight="400">案内</text><circle cx="156" cy="168" r="3.5" fill="#444444"/><rect x="104" y="168" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><path id="fixed-edges" d="M 60 168 H 156 V 262" fill="none" stroke="#111111" stroke-width="3"/><line x1="156" y1="154" x2="104" y2="154" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><line x1="172" y1="168" x2="172" y2="220" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><text x="100" y="140" font-size="16" fill="#c93030" font-weight="400">width ←</text><text x="185" y="201" font-size="16" fill="#c93030" font-weight="400">height ↓</text><circle cx="156" cy="168" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><text x="28" y="296" font-size="20" fill="#111111" font-weight="400">黒いL字＝固定する上端・右端</text><text x="358" y="89" font-size="24" fill="#111111" font-weight="700">② topで下へ</text><text x="358" y="119" font-size="18" fill="#444444" font-weight="400">top: 8px; right: 0</text><rect x="390" y="168" width="96" height="94" fill="#f5f5f5" stroke="none" /><rect x="390" y="168" width="96" height="94" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#text-clear)"/><text x="390" y="236" font-size="48" fill="#315fa0" font-weight="400">案内</text><circle cx="486" cy="168" r="3.5" fill="#444444"/><rect x="434" y="168" width="52" height="52" fill="none" stroke="#c93030" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/><line x1="486" y1="168" x2="486" y2="200" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><rect x="434" y="200" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><circle cx="486" cy="200" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><text x="358" y="296" font-size="20" fill="#444444" font-weight="400">上端を8px下へ</text><text x="688" y="89" font-size="24" fill="#111111" font-weight="700">③ rightで外へ</text><text x="688" y="119" font-size="18" fill="#444444" font-weight="400">top: 8px; right: -20px</text><rect x="720" y="168" width="96" height="94" fill="#f5f5f5" stroke="none" /><rect x="720" y="168" width="96" height="94" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#text-clear)"/><text x="720" y="236" font-size="48" fill="#315fa0" font-weight="400">案内</text><circle cx="816" cy="168" r="3.5" fill="#444444"/><rect x="764" y="200" width="52" height="52" fill="none" stroke="#c93030" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/><line x1="816" y1="200" x2="896" y2="200" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><rect x="844" y="200" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><circle cx="896" cy="200" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><text x="688" y="296" font-size="20" fill="#444444" font-weight="400">右端を20px外へ</text><text x="28" y="330" font-size="18" fill="#444444" font-weight="400">灰色の丸＝親の右上　赤い丸＝箱の右上。点線の赤い箱＝直前の位置。</text><text x="28" y="359" font-size="17" fill="#444444" font-weight="400">寸法と指定座標は4倍。親と文字は模式的。</text></svg>

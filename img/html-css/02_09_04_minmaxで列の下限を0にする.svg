<text x="24" y="34" class="title">列の下限を0へ変える</text>
<text x="24" y="96.0" class="code" xml:space="preserve">.parent {</text><text x="24" y="121.0" class="code" xml:space="preserve">  <tspan class="active-css">grid-template-columns:</tspan></text><g class="motion"><text x="24" y="146.0" class="code" xml:space="preserve" opacity="1"><tspan class="active-css">    1fr 1fr;</tspan><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.0;0.025;0.075;0.5875;0.6375;1.0" calcMode="linear" dur="20s" repeatCount="indefinite" /></text><text x="24" y="146.0" class="code" xml:space="preserve" opacity="0"><tspan class="active-css">    minmax(0, 1fr) minmax(0, 1fr);</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.0875;0.1375;0.525;0.575;1.0" calcMode="linear" dur="20s" repeatCount="indefinite" /></text></g><g class="still"><text x="24" y="146.0" class="code" xml:space="preserve"><tspan class="active-css">    minmax(0, 1fr) minmax(0, 1fr);</tspan></text></g><text x="24" y="171.0" class="code" xml:space="preserve">}</text><g class="motion"><g class="caption"><text x="24" y="209.0" class="status" opacity="1">1. 列の下限を0へ変える → 列幅がそろう<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="20s" repeatCount="indefinite" /></text><text x="24" y="209.0" class="status" opacity="0">2. 1frへ戻す → 内容の最小幅が関わる<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" calcMode="discrete" dur="20s" repeatCount="indefinite" /></text></g><text x="48" y="250.0" class="small parent-label">親：内容幅510px（一定）</text><rect fill="#f5f5f5" x="48.0" y="264.0" width="510.0" height="40.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="408.0" y="264.0" width="30.0" height="40.0"><animate attributeName="x" values="408.0;408.0;288.0;288.0;408.0;408.0" keyTimes="0;0.2625;0.4125;0.7625;0.9125;1" dur="20s" repeatCount="indefinite" /></rect><rect data-child="A" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" x="48.0" y="264.0" width="360" height="40"><animate attributeName="width
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="385.0" viewBox="0 0 640 385.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">列の下限を0へ変える</title><desc id="desc">列をminmax(0, 1fr)へ変えると各240pxに配分する。長い文字そのものは折り返さず、列を越えたまま残る。変更前の広がりは模式表示。 指定変更の説明を表示して2.5秒以上待ち、3秒で変化させる。結果の静止時間を取り、元へ戻す。20秒周期。動きを減らす設定では指定後を静止表示。 説明は1・2の順で表示する。変更するCSSは1秒で消し、0.25秒空けて次の指定を1秒で表示し、表示完了後2.5秒待って3秒で図を変える。</desc>

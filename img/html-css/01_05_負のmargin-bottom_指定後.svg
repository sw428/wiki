<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="title desc">
  <title id="title">子Aにmargin-bottom: -40pxを指定</title>
  <desc id="desc">子A自身は動かず、後続の子Bが通常位置から40px上へ詰まり、子Aに重なる。点線の親の範囲は補助線で、実際のborderではない。箱の高さは模式的に示す。</desc>
  <style>
    .title { font: 700 34px 'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#222; }
    .subtitle { font: 500 22px 'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#444444; }
    .label { font: 700 24px 'Arial','Hiragino Sans','Yu Gothic',sans-serif; }
    .small { font: 500 18px 'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#444444; }
    .note { font: 600 20px 'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#444444; }
  </style>
  <defs>
    <marker id="moveRed" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#c93030" stroke-width="2"/></marker>
  </defs>
  <rect width="900" height="760" fill="#fff"/>
  <text x="450" y="58" text-anchor="middle" class="title">margin-bottom: -40px</text>
  <text x="450" y="95" text-anchor="middle" class="subtitle">子Aの位置は変わらず、次の兄弟要素の子Bが40px上へ詰まる</text>
  <rect x="140" y="145" width="620" height="430" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="450" y="552" text-anchor="middle" class="small">親要素</text>
  <!-- 子Aの下端は320。負のmargin指定前の子Bの上端も320。 -->
  <rect x="220" y="190" width="460" height="130" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
  <text x="450" y="247" text-anchor="middle" class="label" fill="#315fa0">子A（位置は変わらない）</text>
  <!-- 子Bは320から280へ40px上がる。 -->
  <rect x="220" y="280" width="460" height="130" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
  <text x="450" y="372" text-anchor="middle" class="label" fill="#c93030">子B</text>
  <line x1="220" y1="320" x2="680" y2="320" stroke="#666666" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="450" y="458" text-anchor="middle" class="small">点線：負のmargin指定前の子Bの上端</text>
  <!-- 下側の指定は子Aの青、移動は子Bの赤で示す。 -->
  <text x="190" y="305" text-anchor="end" class="label" fill="#315fa0">-40px</text>
  <text x="190" y="334" text-anchor="end" class="small" style="fill:#315fa0">子Aの下margin</text>
  <line x1="740" y1="320" x2="740" y2="280" stroke="#c93030" stroke-width="3" marker-end="url(#moveRed)"/>
  <text x="755" y="307" class="label" fill="#c93030">40px上へ</text>
  <text x="450" y="635" text-anchor="middle" class="note">負の margin-bottom は、後ろに続く子Bを上へ詰める</text>
  <text x="450" y="670" text-anchor="middle" class="note">子A自身は動かない</text>
</svg>

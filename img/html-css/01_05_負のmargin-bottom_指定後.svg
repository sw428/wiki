<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" role="img" aria-labelledby="title desc">
  <title id="title">子Aの負のmargin-bottomで後続の子B・Cだけが40px上へ詰まる</title>
  <desc id="desc">通常フローのブロック配置で、ほかのmarginや位置指定が配置に影響しない例。子Aにmargin-bottom: -40pxを指定しても子A自身は動かず、後続の子B・Cが通常位置から40px上へ詰まる。子Bは子Aに重なり、子Bの子と子Cの子もそれぞれの親と一緒に移動する。指定元である子Aの下marginを青、移動する子B・Cの上向き片矢印を赤・紫で示す。通常位置から指定後までを20秒周期で繰り返し、動きを減らす設定では指定後の静止図を表示する。子B内の点線は指定前の上端、親の灰色点線は範囲の補助線で、実際のCSSのborderではない。箱の高さは模式的に示す。各段階の説明を表示して1.5秒待ち、その後2秒かけて移動する。</desc>
<defs>
  <!-- 文字・数値の下だけ補助線を隠し、領域の背景は保つ。 -->
  <mask id="guide-gap-1" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="900" height="940" style="mask-type:luminance">
    <rect x="0" y="0" width="900" height="940" fill="#ffffff"/>
    <rect x="805" y="281" width="90" height="35" fill="#000000" class="applied"/>
    <rect x="805" y="471" width="90" height="35" fill="#000000" class="applied"/>
    <rect x="262" y="775" width="376" height="28" fill="#000000" class="applied"/>
    <rect x="64" y="358" width="130" height="28" fill="#000000"/>
    <rect x="123" y="323" width="72" height="35" fill="#000000"/>
  </mask>
</defs>
  <style>
    .title { font-weight:700; font-size:34px; font-family:'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#111111; }
    .subtitle { font-weight:500; font-size:22px; font-family:'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#111111; }
    .label { font-weight:700; font-size:24px; font-family:'Arial','Hiragino Sans','Yu Gothic',sans-serif; }
    .small { font-weight:500; font-size:18px; font-family:'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#111111; }
    .note { font-weight:600; font-size:20px; font-family:'Arial','Hiragino Sans','Yu Gothic',sans-serif; fill:#111111; }
    @media (prefers-reduced-motion: no-preference) {
      .moving { animation: move 20s infinite; }
      .applied { animation: reveal 20s infinite; }
      @keyframes move {
        0%, 7.5% { transform: translateY(40px); }
        17.5%, 100% { transform: translateY(0); }
      }
      @keyframes reveal {
        0%, 17.5%, 99%, 100% { opacity: 0; }
        19%, 97% { opacity: 1; }
      }
    }
  </style>
  <defs>
    <marker id="moveRed" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#c93030" stroke-width="2"/></marker>
    <marker id="movePurple" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7c3aed" stroke-width="2"/></marker>
  </defs>
  <rect width="900" height="940" fill="#fff"/>
  <text style="fill:#111111" fill="#111111" x="450" y="58" text-anchor="middle" class="title">子Aに下-margin（margin-bottom: -40px）</text>
  <text style="fill:#111111" fill="#111111" x="450" y="95" text-anchor="middle" class="subtitle">子Aは動かず、後続する兄弟要素全てが40px上へ詰まる</text>
  <rect x="140" y="145" width="620" height="630" fill="#f5f5f5"/>
<rect x="140" y="145" width="620" height="630" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#guide-gap-1)"/>
  <text style="fill:#444444" fill="#444444" x="730" y="130" text-anchor="end" class="small">親要素</text>
  <!-- 子Aの下端は320。負のmargin指定前の子Bの上端も320。 -->
  <rect x="220" y="190" width="460" height="130" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
  <text x="450" y="247" text-anchor="middle" class="label" fill="#315fa0" style="fill:#315fa0"><tspan fill="#315fa0">子A</tspan><tspan fill="#111111">（位置は変わらない）</tspan></text>
  <!-- 子Bは320から280へ40px上がる。 -->
  <g class="moving" id="moving-child-b">
  <rect x="220" y="280" width="460" height="190" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
  <text x="450" y="350" text-anchor="middle" class="label" fill="#c93030" style="fill:#c93030">子B</text>
  <rect x="310" y="384" width="280" height="50" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
  <text x="450" y="416" text-anchor="middle" class="small" style="fill:#be185d" fill="#be185d">子Bの子</text>
  </g>
  <!-- 子Cも510から470へ40px上がり、その子も一緒に動く。 -->
  <g class="moving" id="moving-child-c">
  <rect x="220" y="470" width="460" height="190" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="540" text-anchor="middle" class="label" fill="#7c3aed" style="fill:#7c3aed">子C</text>
  <rect x="310" y="574" width="280" height="50" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
  <text x="450" y="606" text-anchor="middle" class="small" style="fill:#a21caf" fill="#a21caf">子Cの子</text>
  </g>
  <line x1="220" y1="320" x2="680" y2="320" stroke="#666666" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="450" y="795" text-anchor="middle" class="small applied">子B内の点線：負のmargin指定前の子Bの上端</text>
  <!-- 下側の指定は子Aの青、移動は子Bの赤で示す。 -->
  <text x="190" y="349" text-anchor="end" class="label" fill="#315fa0" style="fill:#315fa0">-40px</text>
  <text fill="#315fa0" x="190" y="378" text-anchor="end" class="small" style="fill:#315fa0">子Aの下margin</text>
  <g class="applied">
  <line x1="790" y1="320" x2="790" y2="280" stroke="#c93030" stroke-width="3" marker-end="url(#moveRed)"/>
  <text x="810" y="307" class="label" font-size="20" style="font-size:20px;fill:#c93030" fill="#c93030">40px上へ</text>
  <line x1="790" y1="510" x2="790" y2="470" stroke="#7c3aed" stroke-width="3" marker-end="url(#movePurple)"/>
  <text x="810" y="497" class="label" font-size="20" style="font-size:20px;fill:#7c3aed" fill="#7c3aed">40px上へ</text>
  <text style="fill:#111111" fill="#111111" x="450" y="835" text-anchor="middle" class="note">負の margin-bottom は、後続する兄弟要素全てを上へ詰める</text>
  <text style="fill:#111111" fill="#111111" x="450" y="870" text-anchor="middle" class="note">子B・子Cと、その中の子は一緒に上へ動く</text>
  <text style="fill:#111111" fill="#111111" x="450" y="905" text-anchor="middle" class="note">子A自身は動かない</text>
  </g>
<style>.cue-before{opacity:0}.cue-after{opacity:1}@media(prefers-reduced-motion:no-preference){.cue-before{animation:cue-before 20s steps(1,end) infinite}.cue-after{animation:cue-after 20s steps(1,end) infinite}@keyframes cue-before{0%,17.499995%{opacity:1}17.5%,100%{opacity:0}}@keyframes cue-after{0%,17.499995%{opacity:0}17.5%,100%{opacity:1}}}</style><g id="stage-caption"><text class="cue-before" x="450" y="125" text-anchor="middle" fill="#111111" style="fill:#111111;font-family:Yu Gothic,Meiryo,sans-serif;font-size:18px;font-weight:600"><tspan x="450">子Aは固定し、子B・Cを40px上へ</tspan></text><text class="cue-after" x="450" y="125" text-anchor="middle" fill="#111111" style="fill:#111111;font-family:Yu Gothic,Meiryo,sans-serif;font-size:18px;font-weight:600"><tspan x="450">移動後：子Aの位置は変わらない</tspan></text></g></svg>

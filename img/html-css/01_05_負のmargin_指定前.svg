<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="-70 120 600 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの負のmargin-topを指定する前の通常の配置</title>
<desc id="desc">親の中で子A・子B・子Cが通常の順に並び、子Bの子は子B、子Cの子は子Cの内側にある。子Bのmargin-topが0の指定前の静止図で、指定後の移動はこの図には示さない。親子関係と配置を示す模式図で、箱の高さや間隔はCSSの寸法どおりではない。灰色の点線は親の範囲を示す補助線で、実際のCSSのborderではない。</desc>
<style>
    .title { font-weight:700; font-size:30px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#111111; }
    .subtitle { font-weight:500; font-size:20px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#111111; }
    .label { font-weight:700; font-size:20px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#111111; }
    .small { font-weight:500; font-size:16px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#111111; }
    .em { font-weight:700; font-size:18px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#c93030; }
    .note { font-weight:500; font-size:17px; font-family:'Arial', 'Hiragino Sans', 'Yu Gothic', sans-serif; fill:#111111; }
  </style>
<defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf2e2e"/>
    </marker>
  </defs>
<rect x="-70" y="120" width="600" height="1000" fill="#fff"/>
<!-- Left panel -->
  <rect x="35" y="130" width="390" height="980" rx="18" fill="#f7fbff"/>
  <text style="fill:#111111" x="60" y="180" class="title" fill="#111111">① 子Bに負のmarginを指定する前</text>
  <text x="60" y="215" class="subtitle" style="fill: #c93030">child-b の margin-top: 0</text>

  <rect x="80" y="260" width="300" height="760" fill="#f5f5f5" stroke="#666" stroke-width="2" stroke-dasharray="8 7"/>
  <text style="fill:#444444" fill="#444444" x="380" y="245" text-anchor="end" class="small">親要素 .parent</text>

  <!-- child A -->
  <rect x="120" y="300" width="220" height="110" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
  <text x="230" y="365" text-anchor="middle" class="label" fill="#315fa0" style="fill:#315fa0">子A</text>

  <!-- child B -->
  <rect x="120" y="430" width="220" height="180" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
  <text x="230" y="485" text-anchor="middle" class="label" fill="#c93030" style="fill:#c93030">子B</text>
  <text x="230" y="515" text-anchor="middle" class="small" style="fill: #c93030">margin-top: 0</text>
  <rect x="155" y="535" width="150" height="48" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
  <text x="230" y="565" text-anchor="middle" class="small" fill="#be185d" style="fill:#be185d">子Bの子</text>

  <!-- child C -->
  <rect x="120" y="630" width="220" height="180" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="685" text-anchor="middle" class="label" fill="#7c3aed" style="fill:#7c3aed">子C</text>
  <rect x="155" y="735" width="150" height="48" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
  <text x="230" y="765" text-anchor="middle" class="small" fill="#a21caf" style="fill:#a21caf">子Cの子</text>

  <text style="fill:#111111" fill="#111111" x="230" y="1060" text-anchor="middle" class="note">子A → 子B → 子C が通常どおり並ぶ</text>

  </svg>

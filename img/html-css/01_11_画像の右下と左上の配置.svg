<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">absoluteで同じ画像の右下・左上を親の同じ角に合わせる</title>
  <desc id="desc">position: relativeの親を幅364px・高さ255px、その子の画像をposition: absolute、幅119px・高さ66pxとして配置を比較する。親と画像にmargin・padding・borderはない。左はright: 0; bottom: 0で親と画像の右下、右はtop: 0; left: 0で親と画像の左上が重なる。両図で親と画像の大きさは同じ。赤い箱は画像要素の表示範囲、丸印は角が重なる点、灰色の点線は親の範囲を示す補助線で、実際のCSSのborderではない。画像の幅や高さを変える比較ではない。</desc>
  <style>
    text { font-family: "Yu Gothic", Meiryo, sans-serif; }
    .heading { font-size: 26px; font-weight: 700; fill: #111111; }
    .code { font-size: 21px; fill: #111111; }
    .parent { fill: #f5f5f5; }
    .guide { fill: none; stroke: #666666; stroke-width: 2; stroke-dasharray: 8 7; }
    .parent-label { font-size: 19px; fill: #444444; }
    .image-label { font-size: 18px; fill: #c93030; }
    .result { font-size: 22px; font-weight: 700; fill: #111111; }
  </style>
  <defs>
    <mask id="label-clear">
      <rect width="1080" height="600" fill="#ffffff"/>
      <rect x="623" y="275" width="168" height="31" fill="#000000"/>
    </mask>
    <g id="picture">
      <rect width="119" height="66" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
    </g>
    <g id="coincidence">
      <circle r="9" fill="#ffffff" stroke="#666666" stroke-width="2"/>
      <circle r="5" fill="#c93030"/>
    </g>
  </defs>
  <rect width="1080" height="600" fill="#ffffff"/>
  <text style="fill:#111111" fill="#111111" x="45" y="47" class="heading">どの端を、親のどの端に合わせるか</text>

  <text style="fill:#111111" x="90" y="103" class="heading" fill="#111111">① 右下へ置く</text>
  <text x="90" y="136" class="code">right: 0; bottom: 0;</text>
  <text x="90" y="178" class="parent-label">親：364 × 255px</text>
  <rect x="90" y="200" width="364" height="255" class="parent"/>
  <use href="#picture" x="335" y="389"/>
  <rect x="90" y="200" width="364" height="255" class="guide"/>
  <text x="290" y="374" class="image-label">画像：119 × 66px</text>
  <use href="#coincidence" x="454" y="455"/>
  <text x="90" y="505" class="result">親の右下 ＝ 画像の右下</text>

  <text style="fill:#111111" x="630" y="103" class="heading" fill="#111111">② 左上へ置く</text>
  <text x="630" y="136" class="code">top: 0; left: 0;</text>
  <text x="630" y="178" class="parent-label">親：364 × 255px</text>
  <rect x="630" y="200" width="364" height="255" class="parent"/>
  <use href="#picture" x="630" y="200"/>
  <rect x="630" y="200" width="364" height="255" class="guide" mask="url(#label-clear)"/>
  <text x="630" y="296" class="image-label">画像：119 × 66px</text>
  <use href="#coincidence" x="630" y="200"/>
  <text x="630" y="505" class="result">親の左上 ＝ 画像の左上</text>

  <use href="#coincidence" x="100" y="555"/>
  <text x="121" y="562" class="parent-label" fill="#111111" style="fill:#111111">親と画像の角が重なる点</text>
</svg>

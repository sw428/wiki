<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-labelledby="title description">
  <title id="title">負のmargin同士のマージン相殺</title>
  <desc id="description">子Aのmargin-bottomはマイナス20px、子Bのmargin-topはマイナス30px。相殺結果はマイナス30pxとなり、子Aと子Bが30px重なる。両方のmarginが0の通常位置から、二つの指定を相殺した結果の位置までを20秒周期で繰り返す。指定値を別々に足して移動させる図ではない。重なりと結果の寸法は移動後に表示し、動きを減らす設定では指定後の静止図を表示する。</desc>
  <style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; fill: #26282d; }
    .title { font-size: 33px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #545961; }
    .heading { font-size: 21px; font-weight: 700; }
    .body { font-size: 19px; }
    .sm { font-size: 16px; }
    .box-label { font-size: 28px; font-weight: 700; }
    .numeric { font-size: 23px; font-weight: 700; fill: #111111; }
    .result { font-size: 26px; font-weight: 700; fill: #111111; }
    .dim { stroke: #111111; stroke-width: 2.6; fill:none; stroke-linecap:round; }
    @media (prefers-reduced-motion: no-preference) {
      .moving { animation: move 20s infinite; }
      .applied { animation: reveal 20s infinite; }
      @keyframes move {
        0%, 10% { transform: translateY(30px); }
        22.5%, 100% { transform: translateY(0); }
      }
      @keyframes reveal {
        0%, 22%, 99%, 100% { opacity: 0; }
        24%, 97% { opacity: 1; }
      }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#111111" />
    </marker>
  </defs>
  <rect width="900" height="880" fill="#ffffff"/>
  <text x="56" y="73" class="title">⑨ 負のmargin同士のマージン相殺</text>
  <text x="58" y="110" class="subtitle">通常フローの兄弟ブロック要素（相殺する場合）</text>

  <rect x="54" y="142" width="792" height="142" rx="13" fill="#f4f5f7"/>
  <text x="81" y="181" class="heading">CSSの指定</text>
  <text x="82" y="216" class="body" style="fill: #315fa0">子A　 margin-bottom: <tspan font-weight="700">-20px</tspan>;</text>
  <text x="82" y="251" class="body" style="fill: #c93030">子B　 margin-top: <tspan font-weight="700">-30px</tspan>;</text>

  <!-- Reference parent enclosure: a guide, not a CSS border -->
  <rect x="85" y="316" width="730" height="340" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="110" y="346" class="sm" fill="#444444" style="fill: #444444">親要素（破線は説明用）</text>

  <!-- child A, ending at y=503 -->
  <rect x="195" y="370" width="425" height="133" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
  <text x="408" y="430" text-anchor="middle" class="box-label">子A</text>
  <text x="408" y="463" text-anchor="middle" class="sm" style="fill: #315fa0">margin-bottom: -20px</text>

  <!-- child B begins 30 px above child A's bottom -->
  <g class="moving" id="moving-child-b">
  <rect x="195" y="473" width="425" height="133" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
  <!-- overlapping area, highlighted for teaching clarity -->
  <g class="applied">
  <rect x="195" y="473" width="425" height="30" fill="#dca7b8" opacity="0.55"/>
  <path d="M195 473 H620 M195 503 H620" stroke="#8c5b64" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>
  <text x="408" y="551" text-anchor="middle" class="box-label">子B</text>
  <text x="408" y="585" text-anchor="middle" class="sm" style="fill: #c93030">margin-top: -30px</text>
  </g>

  <!-- Dimension bracket for overlap -->
  <g class="applied">
  <path d="M638 473 H665 M638 503 H665" stroke="#111111" stroke-width="1.8" />
  <path class="dim" d="M666 478 V498" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="683" y="480" class="numeric">30px</text>
  <text x="683" y="505" class="sm">重なる</text>
  </g>

  <!-- Bottom result -->
  <rect x="54" y="689" width="792" height="134" rx="13" fill="#fcf1e4"/>
  <text x="450" y="733" text-anchor="middle" class="heading">負のmargin同士は足し算しない</text>
  <g class="applied">
  <text x="450" y="775" text-anchor="middle" class="result">-20px と -30px → 相殺結果 -30px</text>
  <text x="450" y="803" text-anchor="middle" class="sm">絶対値が大きい方が結果になり、要素は30px重なる</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1000" viewBox="0 0 2160 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの上下の負のmarginが後続の配置に与える影響：三段階の比較</title><desc id="desc">左から指定前、子Bに上marginだけを-40px、上下のmarginを-40pxにした静止比較図。通常フローで各兄弟の高さは100px、ほかの上下marginは0。中央では子B・C・Dと各子が40px上へ、右では子Bとその子が40px、子C・Dと各子が80px上へ詰まる。子Aとその子は動かない。中央は子Bの上端の指定値、右は下marginを含めた次の配置基準を表示する。右のmargin-bottom: -40pxは、子Bの下端より40px上の位置に灰色で示す。表記の位置は子Bの箱の下端が移動したことを意味しない。灰色の点線の領域は子Bが子Aに重なった部分、灰色の点線の領域は子Cが子Bに重なった部分。点線は面積を示す補助表示で実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。</desc>

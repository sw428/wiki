<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1000" viewBox="0 0 2160 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの上下の負のmarginが後続の配置に与える影響：三段階の比較</title><desc id="desc">左から指定前、子Bの上marginだけを-40pxにした配置、下marginも-40pxにした配置を並べた静止比較図。通常フローのブロック配置で、各兄弟の高さは100px、ほかの上下marginは0。中央では子B・C・Dとそれぞれの子が指定前より40px上へ詰まる。右では子Bとその子は40px上、子C・Dとそれぞれの子は80px上へ詰まる。子Aとその子は三つの図で同じ位置にある。各矢印は指定前からの移動量を示し、後続要素ごとに移動量が増える意味ではない。箱の外枠と親の灰色点線は補助表示で、実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="736" height="350" viewBox="0 0 736 350" role="img" aria-labelledby="title desc"><title id="title">frの配分とgap</title><desc id="desc">内容の最小幅が配分を妨げない条件で、親の内容幅528pxからgap32pxを除いた496pxを1frと3frへ配る。左列124px、右列372px。列はシアン、gapは紫で識別する。</desc><style>text{font-family:"Yu Gothic",Meiryo,sans-serif;font-size:20px;fill:#000000;font-weight:500}.small{font-size:18px}.parent{fill:#444444}.title,.status{fill:#000000;font-weight:700}.gap{fill:#7C3AED;font-weight:700}.column{fill:#007F99;font-weight:700}</style><rect width="736" height="350" fill="white"/><text x="24" y="34" class="title">gapを除いた幅を、1対3で配る</text><text x="88" y="77" class="parent">親：内容幅528px</text><rect x="88" y="102" width="528" height="100" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/><rect x="212" y="102" width="32" height="100" fill="#ECE5FF" data-grid-gap="true"/><rect x="88" y="102" width="124" height="100" fill="#007F99" fill-opacity="0.10" stroke="#007F99" stroke-width="2" data-grid-column="true"/><rect x="244" y="102" width="372" height="100" fill="#007F99" fill-opacity="0.10" stroke="#007F99" stroke-width="2" data-grid-column="true"/><text x="150" y="142" text-anchor="middle" class="column">1fr</text><text x="150" y="178" text-anchor="middle" class="column">124px</text><text x="430" y="142" text-anchor="middle" class="column">3fr</text><text x="430" y="178" text-anchor="middle" class="column">372px</text><path d="M228 216V250" fill="none" stroke="#7C3AED"/><text x="228" y="278" text-anchor="middle" class="gap">gap：32px</text><text x="88" y="322" class="small">列へ配る幅：496px（124px ＋ 372px）</text></svg>
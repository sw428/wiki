<line x1="365" y1="550" x2="365" y2="390" stroke="#7c3aed" stroke-width="3" marker-end="url(#m3-c)"/><text style="fill:#7c3aed" x="405" y="478" class="label" fill="#7c3aed">80px上</text>

<line x1="365" y1="750" x2="365" y2="590" stroke="#be185d" stroke-width="3" marker-end="url(#m3-d)"/><text style="fill:#be185d" x="405" y="678" class="label" fill="#be185d">80px上</text></g><g id="stage-caption"><text x="365" y="190" class="small phase-before" fill="#111111" style="font-size:22px;font-weight:600;fill:#111111"><tspan x="365">上marginで</tspan><tspan x="365" dy="32">子B・C・Dを上へ</tspan></text>
<text x="365" y="190" class="small phase-applying-top" fill="#111111" style="font-size:22px;font-weight:600;fill:#111111">上margin適用中</text>

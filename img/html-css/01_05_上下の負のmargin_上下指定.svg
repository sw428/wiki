@keyframes top-result{0%,19.444438889%{opacity:0}19.444444444%,27.777772222%{opacity:1}27.777777778%,100%{opacity:0}}
@keyframes middle-effects{0%,19.444438889%{opacity:0}19.444444444%,55.55555%{opacity:1}55.555555556%,100%{opacity:0}}
@keyframes bottom-before{0%,27.777772222%{opacity:0}27.777777778%,36.111105556%{opacity:1}36.111111111%,100%{opacity:0}}

@keyframes applying-second{0%,55.55555%{opacity:0}55.555555556%,66.666661111%{opacity:1}66.666666667%,100%{opacity:0}}
@keyframes top-active{0%,27.777772222%{opacity:1}27.777777778%,100%{opacity:0}}
@keyframes bottom-active{0%,27.777772222%{opacity:0}27.777777778%,100%{opacity:1}}
@keyframes top-zero{0%,19.444438889%{opacity:1}19.444444444%,100%{opacity:0}}
@keyframes top-negative{0%,19.444438889%{opacity:0}19.444444444%,100%{opacity:1}}
@keyframes bottom-zero{0%,47.222216667%{opacity:1}47.222222222%,100%{opacity:0}}
@keyframes bottom-negative{0%,47.222216667%{opacity:0}47.222222222%,100%{opacity:1}}
@keyframes top-overlap-visible{0%,8.333327778%{opacity:0}8.333333333%,100%{opacity:1}}
@keyframes bottom-overlap-visible{0%,55.55555%{opacity:0}55.555555556%,100%{opacity:1}}
@keyframes moving-bottom-mark{0%,36.111105556%{opacity:0}36.111111111%,47.222216667%{opacity:1}47.222222222%,100%{opacity:0}}
@keyframes bottom-ready{0%,47.222216667%{opacity:0}47.222222222%,55.55555%{opacity:1}55.555555556%,100%{opacity:0}}
@keyframes bottom-mark-color{0%,36.111105556%{color:#c93030}36.111111111%,100%{color:#666666}}
}</style>

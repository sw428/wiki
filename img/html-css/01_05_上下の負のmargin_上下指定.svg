<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
<title id="title">上下の負のmarginによる変化が蓄積し、子C・Dが80px上へ詰まる</title>
<desc id="desc">子A〜Dにはそれぞれ子が一つある。通常フローで各兄弟の高さは100px、他の上下marginは0。まずBからDが40px上へ動き、その後CとDがさらに40px上へ動く。18秒周期。動きを減らす設定では最終状態を表示する。図の外枠と親の点線は説明用でCSSのborderではない。詳細は参照元Markdownに記載する。</desc>
<style>text{font-family:"Yu Gothic","Meiryo",sans-serif}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-size:19px;font-family:Consolas,monospace}.phase-before,.phase-top,.phase-applying-top,.phase-applying-bottom,.mid-effects{opacity:0}.phase-final{opacity:1}
@media(prefers-reduced-motion:no-preference){
#stage-3-b{animation:move-b 18s infinite}
#stage-3-c,#stage-3-d{animation:move-following 18s infinite}
.parent-range{animation:parent-both 18s infinite}
.top-effects{animation:show-first 18s infinite}
.bottom-effects,.phase-final{animation:show-both 18s infinite}
.phase-before{animation:before-both 18s infinite}
.phase-top,.mid-effects{animation:middle-both 18s infinite}
.phase-applying-top{animation:applying-first 18s infinite}
.phase-applying-bottom{animation:applying-second 18s infinite}
@keyframes move-b{0%,15%{transform:translateY(80px)}35%,100%{transform:translateY(0)}}
@keyframes move-following{0%,15%{transform:translateY(160px)}35%,50%{transform:translateY(80px)}70%,100%{transform:translateY(0)}}
@keyframes parent-both{0%,15%{height:800px}35%,50%{height:720px}70%,100%{height:640px}}
@keyframes show-first{0%,34%{opacity:0}35%,100%{opacity:1}}
@keyframes show-both{0%,69%{opacity:0}70%,100%{opacity:1}}
@keyframes before-both{0%,14%{opacity:1}15%,100%{opacity:0}}
@keyframes middle-both{0%,34%{opacity:0}35%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes applying-first{0%,14%{opacity:0}15%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes applying-second{0%,49%{opacity:0}50%,69%{opacity:1}70%,100%{opacity:0}}
}</style>
<defs><marker id="m3-b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c93030" stroke-width="2"/></marker><marker id="m3-c" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker><marker id="m3-d" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#be185d" stroke-width="2"/></marker></defs><rect width="700" height="1000" fill="#ffffff"/><text x="40" y="48" class="heading" fill="#222222">③ 上下margin</text><text x="40" y="89" class="small phase-before" fill="#222222">指定前</text><text x="40" y="89" class="small phase-applying-top" fill="#222222">上margin適用中</text><text x="40" y="89" class="small phase-applying-bottom" fill="#222222">下margin適用中</text><text x="40" y="89" class="small phase-top" fill="#222222">上margin適用</text><text x="40" y="89" class="small phase-final" fill="#222222">下marginも適用</text><text x="42" y="131" class="small" fill="#444444">親要素 .parent</text><rect class="parent-range" x="40" y="150" width="620" height="640" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/><g id="stage-3-a"><rect x="70" y="150" width="250" height="200" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="98" y="186" class="label" fill="#315fa0">子A .a</text>
<rect x="108" y="205" width="174" height="45" rx="4" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="133" y="235" class="small" fill="#be185d">子Aの子</text></g><g id="stage-3-b"><rect x="70" y="270" width="250" height="200" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="98" y="306" class="label" fill="#c93030">子B .b</text>
<rect x="108" y="325" width="174" height="45" rx="4" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
<text x="133" y="355" class="small" fill="#a21caf">子Bの子</text></g><g id="stage-3-c"><rect x="70" y="390" width="250" height="200" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="98" y="426" class="label" fill="#7c3aed">子C .c</text>
<rect x="108" y="445" width="174" height="45" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="133" y="475" class="small" fill="#315fa0">子Cの子</text></g><g id="stage-3-d"><rect x="70" y="590" width="250" height="200" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="98" y="626" class="label" fill="#be185d">子D .d</text>
<rect x="108" y="645" width="174" height="45" rx="4" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="133" y="675" class="small" fill="#7c3aed">子Dの子</text></g><g class="top-effects"><text x="393" y="247" class="code" fill="#c93030">margin-top: -40px</text><line x1="365" y1="350" x2="365" y2="270" stroke="#c93030" stroke-width="3" marker-end="url(#m3-b)"/><text x="389" y="318" class="label" fill="#c93030">40px上</text></g><g class="mid-effects"><line x1="365" y1="550" x2="365" y2="470" stroke="#7c3aed" stroke-width="3" marker-end="url(#m3-c)"/><text x="389" y="518" class="label" fill="#7c3aed">40px上</text><line x1="365" y1="750" x2="365" y2="670" stroke="#be185d" stroke-width="3" marker-end="url(#m3-d)"/><text x="389" y="718" class="label" fill="#be185d">40px上</text></g><g class="bottom-effects">
<line x1="365" y1="550" x2="365" y2="390" stroke="#7c3aed" stroke-width="3" marker-end="url(#m3-c)"/><text x="389" y="478" class="label" fill="#7c3aed">80px上</text>
<text x="426" y="512" class="code" fill="#c93030">Bのmargin-bottom:</text><text x="426" y="541" class="code" fill="#c93030">-40px</text>
<line x1="365" y1="750" x2="365" y2="590" stroke="#be185d" stroke-width="3" marker-end="url(#m3-d)"/><text x="389" y="678" class="label" fill="#be185d">80px上</text></g></svg>

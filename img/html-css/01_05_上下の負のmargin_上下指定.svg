<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの上下の負のmarginで子Bは40px、子C・Dは80px上へ詰まる</title>
<desc id="desc">通常フローで各兄弟の高さは100px、ほかの上下marginは0。まず子Bの上端にmargin-top: 0を表示し、子B・C・Dと各子が40px上へ動いた後で-40pxに切り替える。続いて上端の表記を隠し、子Bの下端に赤いmargin-bottom: 0を表示する。下marginの配置基準の補助線は灰色。赤い表記は動き始めると灰色に変わり、補助線と一緒に子Bの下端から40px上へ移動してmargin-bottom: -40pxになる。その配置基準が止まった後で、後続の子C・Dと各子がさらに40px上へ動く。下marginの段階では子Bとその子は動かず、表記の移動は子Bの箱の移動を意味しない。子Aとその子も動かない。最終的に子Bは合計40px、子C・Dは合計80px上へ詰まる。灰色の点線は子Bと子A、子Cと子Bの重なった面積で、要素の移動に合わせて広がる。右側の黒い状況説明は、指定前・指定の適用・配置基準の移動・後続の移動・結果の段階に合わせて切り替わる。18秒周期の説明用アニメーションで、実際のCSS処理がこの順に逐次実行されることを示すものではない。動きを減らす設定では最終状態を表示する。外枠・点線・配置基準の補助線は説明用で実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。各段階の説明を表示して1.5秒待ち、その後2秒かけて移動する。</desc>
<style>text{font-family:"Yu Gothic","Meiryo",sans-serif}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-size:19px;font-family:Consolas,monospace}.phase-before,.phase-top,.phase-bottom-before,.phase-moving-bottom-mark,.phase-bottom-ready,.phase-applying-top,.phase-applying-bottom,.mid-effects{opacity:0}.phase-final{opacity:1}.top-value-zero,.bottom-value-zero{opacity:0}.top-value-negative,.bottom-value-negative{opacity:1}.top-annotation{opacity:0}.bottom-annotation{opacity:1}
@media(prefers-reduced-motion:no-preference){
#stage-3-b{animation:move-b 18s infinite}
#stage-3-c,#stage-3-d{animation:move-following 18s infinite}
.parent-range{animation:parent-both 18s infinite}
.top-effects{animation:show-first 18s steps(1,end) infinite}
.bottom-effects,.phase-final{animation:show-both 18s steps(1,end) infinite}
.phase-before{animation:before-both 18s steps(1,end) infinite}
.phase-top{animation:top-result 18s steps(1,end) infinite}
.mid-effects{animation:middle-effects 18s steps(1,end) infinite}
.phase-bottom-before{animation:bottom-before 18s steps(1,end) infinite}
.phase-moving-bottom-mark{animation:moving-bottom-mark 18s steps(1,end) infinite}
.phase-bottom-ready{animation:bottom-ready 18s steps(1,end) infinite}
.bottom-offset{animation:move-bottom-mark 18s infinite,bottom-mark-color 18s steps(1,end) infinite}
.phase-applying-top{animation:applying-first 18s steps(1,end) infinite}
.phase-applying-bottom{animation:applying-second 18s steps(1,end) infinite}
.top-annotation{animation:top-active 18s steps(1,end) infinite}
.bottom-annotation{animation:bottom-active 18s steps(1,end) infinite}
.top-value-zero{animation:top-zero 18s steps(1,end) infinite}
.top-value-negative{animation:top-negative 18s steps(1,end) infinite}
.bottom-value-zero{animation:bottom-zero 18s steps(1,end) infinite}
.bottom-value-negative{animation:bottom-negative 18s steps(1,end) infinite}
.overlap-top{animation:overlap-first 18s infinite,top-overlap-visible 18s steps(1,end) infinite}
.overlap-bottom{animation:overlap-second 18s infinite,bottom-overlap-visible 18s steps(1,end) infinite}

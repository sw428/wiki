<text x="133" y="235" class="small" fill="#be185d" style="fill:#be185d">子Aの子</text></g><g id="stage-3-b"><rect x="70" y="270" width="250" height="200" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>

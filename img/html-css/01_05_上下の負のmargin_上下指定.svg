<text x="365" y="190" class="small phase-bottom-ready" fill="#111111" style="font-size:22px;font-weight:600;fill:#111111"><tspan x="365">子Bを固定して</tspan><tspan x="365" dy="32">子C・Dを上へ</tspan></text>

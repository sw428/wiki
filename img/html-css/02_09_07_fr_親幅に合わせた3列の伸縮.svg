<svg xmlns="http://www.w3.org/2000/svg" width="736" height="469" viewBox="0 0 736 469" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">親幅に合わせて3つの1fr列が一緒に伸縮する</title>
<desc id="desc">元図の3列の伸縮部分を分けた図。親の内容幅が580pxから370pxへ変わると、26pxのgap2か所を保ったまま各列が176pxから106pxへ縮む。上が動く比較、下が370pxの静止比較。縮める説明を表示して2.5秒以上後に3秒で縮める。8.5秒で戻す説明を表示し2.5秒以上後に3秒で戻す。17秒周期。動きを減らす設定では上も580pxの静止表示。列はシアン、gapの値は紫。点線と色付き外枠は補助表示でCSSのborderではない。親の外枠も灰色の塗りと同じ幅へ伸縮する。点線は辺ごとに一定の起点から描き、線の間隔と位相を保つため、外周に沿って流れない。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
<rect x="0" y="0" width="736" height="469" fill="#ffffff"/>
<g id="drawing" transform="translate(0 131)">


<style>text{font-family:'Yu Gothic',Meiryo,sans-serif;font-size:20px;fill:#000000;font-weight:500}.parent{fill:#f5f5f5;stroke:#666666;stroke-width:2;stroke-dasharray:8 7}.parent-label{fill:#444444}.small{font-size:18px}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.title,.status{fill:#000000;font-weight:700}.gap{fill:#7C3AED;font-weight:700}.column{fill:#007F99;font-weight:700}</style>
<rect width="736" height="338" fill="#ffffff"/>
<g class="motion">
<g class="caption"><text x="32" y="28" class="status">親の幅を縮める<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="17s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="32" y="28" class="status" opacity="0">親の幅を戻す<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="17s" calcMode="discrete" repeatCount="indefinite"/></text>
</g><text x="32" y="60" class="status">親の内容幅 580px ↔ 370px</text>
<rect class="current-parent" fill="#f5f5f5" stroke="none" x="32" y="78" width="580" height="56"><animate attributeName="width" values="580;580;370;370;580;580" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></rect>
<g class="parent-outline" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" stroke-dashoffset="0">
<line data-side="top" x1="32" y1="78" x2="612" y2="78"><animate attributeName="x2" values="612;612;402;402;612;612" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></line>
<line data-side="bottom" x1="32" y1="134" x2="612" y2="134"><animate attributeName="x2" values="612;612;402;402;612;612" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></line>
<line data-side="left" x1="32" y1="78" x2="32" y2="134"/>
<line data-side="right" x1="612" y1="78" x2="612" y2="134"><animate attributeName="x1" values="612;612;402;402;612;612" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/><animate attributeName="x2" values="612;612;402;402;612;612" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></line>
</g>
<rect x="32" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"><animate attributeName="width" values="176;176;106;106;176;176" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></rect>
<text x="120" y="112" text-anchor="middle" class="column">1fr<animate attributeName="x" values="120;120;85;85;120;120" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></text>
<rect x="234" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"><animate attributeName="width" values="176;176;106;106;176;176" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/><animate attributeName="x" values="234;234;164;164;234;234" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></rect>
<text x="322" y="112" text-anchor="middle" class="column">1fr<animate attributeName="x" values="322;322;217;217;322;322" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></text>
<rect x="436" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"><animate attributeName="width" values="176;176;106;106;176;176" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/><animate attributeName="x" values="436;436;296;296;436;436" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></rect>
<text x="524" y="112" text-anchor="middle" class="column">1fr<animate attributeName="x" values="524;524;349;349;524;524" keyTimes="0;0.176470588;0.352941177;0.676470588;0.852941177;1" dur="17s" repeatCount="indefinite"/></text>
</g>
<g class="still">
<text x="32" y="28" class="status" >動きを抑えた表示</text>
<text x="32" y="60" class="status">親の内容幅580px・各列176px</text>
<rect class="parent" x="32" y="78" width="580" height="56"/>
<rect x="32" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="120" y="112" text-anchor="middle" class="column">176px</text>
<rect x="234" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="322" y="112" text-anchor="middle" class="column">176px</text>
<rect x="436" y="81" width="176" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="524" y="112" text-anchor="middle" class="column">176px</text>
</g>
<text x="32" y="162" class="small status">外枠の点線：親の幅に合わせて縮む</text>
<text x="32" y="196" class="status">比較：親の内容幅370px・各列106px</text>
<rect class="parent" x="32" y="214" width="370" height="56"/>
<rect x="32" y="217" width="106" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="85" y="248" text-anchor="middle" class="column">106px</text>
<rect x="164" y="217" width="106" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="217" y="248" text-anchor="middle" class="column">106px</text>
<rect x="296" y="217" width="106" height="50" fill="#007F99" fill-opacity="0.10" stroke="#007F99" data-grid-column="true"/>
<text x="349" y="248" text-anchor="middle" class="column">106px</text>
<text x="32" y="318" class="small"><tspan class="gap">gap26px</tspan>は固定・列の最小値は0</text>

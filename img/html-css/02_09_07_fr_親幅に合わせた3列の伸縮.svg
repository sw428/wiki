<g id="css"><text x="28" y="68" xml:space="preserve" style="font-family:Consolas,Meiryo,monospace;font-size:19px;font-weight:500;fill:#313539"><tspan x="28"><tspan fill="#744047" style="fill:#744047">.parent</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">display</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#365F8F" style="fill:#365F8F">grid</tspan><tspan fill="#313539" style="fill:#313539">; </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">gap</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">26px</tspan><tspan fill="#313539" style="fill:#313539">;</tspan></tspan><tspan x="28" dy="28"><tspan fill="#313539" style="fill:#313539">  </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">grid-template-columns</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#7A633D" style="fill:#7A633D">repeat</tspan><tspan fill="#313539" style="fill:#313539">(</tspan><tspan fill="#3B765B" style="fill:#3B765B">3</tspan><tspan fill="#313539" style="fill:#313539">, </tspan><tspan fill="#7A633D" style="fill:#7A633D">minmax</tspan><tspan fill="#313539" style="fill:#313539">(</tspan><tspan fill="#3B765B" style="fill:#3B765B">0</tspan><tspan fill="#313539" style="fill:#313539">, </tspan><tspan fill="#3B765B" style="fill:#3B765B">1fr</tspan><tspan fill="#313539" style="fill:#313539">));</tspan></tspan><tspan x="28" dy="28"><tspan fill="#313539" style="fill:#313539">  </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">width</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">580px</tspan><tspan fill="#313539" style="fill:#313539">; </tspan><tspan fill="#4C764C" style="fill:#4C764C">/* 370pxへ変更して比較 */</tspan><tspan fill="#313539" style="fill:#313539"> }</tspan></tspan></text></g>

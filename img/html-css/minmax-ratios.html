<div id="minmax-ratio-explanation">
  <style>
    #minmax-ratio-explanation { color: var(--foreground); }
    #minmax-ratio-explanation .diagram { display: block; width: 100%; background: #ffffff; }
    #minmax-ratio-explanation .key { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
    #minmax-ratio-explanation svg text { fill: #111111; font-family: sans-serif; font-size: 14px; }
    #minmax-ratio-explanation .parent { fill: #f5f5f5; stroke: #666666; stroke-width: 2; stroke-dasharray: 8 7; }
  </style>
  <div class="key"><span>親の内容幅: 612px</span><span>gap: 0</span><span>各列の最小値: 0</span></div>
  <svg class="diagram" role="img" aria-labelledby="minmax-ratio-title minmax-ratio-desc" height="232">
    <title id="minmax-ratio-title">10frずつでも1frずつでも、等分する結果は同じ</title>
    <desc id="minmax-ratio-desc">親の内容幅612px、gap0、空の子を3つ置いた比較。各列をminmax(0,10fr)とした場合もminmax(0,1fr)とした場合も、3列はそれぞれ204pxになる。色は左から青、赤、紫で両方の図に共通。点線は親の範囲を示す説明用の補助線。</desc>
    <g data-rows></g>
  </svg>
  <script>
    (() => {
      const root = document.getElementById('minmax-ratio-explanation');
      const svg = root.querySelector('svg');
      const rows = root.querySelector('[data-rows]');
      const ns = 'http://www.w3.org/2000/svg';
      function element(tag, attributes, text) {
        const item = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, String(value));
        if (text !== undefined) item.textContent = text;
        rows.appendChild(item);
      }
      function draw() {
        const width = root.getBoundingClientRect().width;
        if (!width) return;
        svg.setAttribute('viewBox', `0 0 ${width} 232`);
        rows.replaceChildren();
        const available = width - 32;
        const colors = [['#cfe4ff', '#315fa0'], ['#f8cfd6', '#c93030'], ['#e9ddff', '#7c3aed']];
        ['10fr : 10fr : 10fr', '1fr : 1fr : 1fr'].forEach((label, index) => {
          const y = 42 + 100 * index;
          element('text', { x: 16, y: y - 15 }, label);
          element('rect', { x: 16, y, width: available, height: 50, class: 'parent' });
          colors.forEach(([fill, stroke], column) => {
            const x = 16 + column * available / 3;
            element('rect', { x, y: y + 3, width: available / 3, height: 44, fill, stroke });
            element('text', { x: x + available / 6, y: y + 29, 'text-anchor': 'middle' }, '204px');
          });
        });
        element('text', { x: 16, y: 222 }, 'どちらも、同じ幅を3列へ等分');
      }
      new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
</div>

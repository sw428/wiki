<text x="133" y="235" class="small" fill="#be185d" style="fill:#be185d">子Aの子</text></g><g id="stage-1-b"><rect x="70" y="350" width="250" height="200" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="98" y="386" class="label" fill="#c93030" style="fill:#c93030">子B .b</text>
<rect x="108" y="405" width="174" height="45" rx="4" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
<text x="133" y="435" class="small" fill="#a21caf" style="fill:#a21caf">子Bの子</text></g><g id="stage-1-c"><rect x="70" y="550" width="250" height="200" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="98" y="586" class="label" fill="#7c3aed" style="fill:#7c3aed">子C .c</text>
<rect x="108" y="605" width="174" height="45" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>

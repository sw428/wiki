<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
<title id="title">上下の負のmarginを指定する前の子A〜Dの配置</title>
<desc id="desc">子AからDが通常フローのブロック配置で上から順に並び、それぞれの子は親となる箱の内側にある。各兄弟の高さは100px、上下marginは0で、子Bの負のmarginを指定する前の静止図。横幅と内部の子の寸法は模式的に示す。箱の色付き外枠と親の灰色点線は識別と範囲の補助表示で、実際のCSSのborderではない。</desc>
<style>text{font-family:"Yu Gothic","Meiryo",sans-serif}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-size:19px;font-family:Consolas,monospace}.phase-before,.phase-top,.mid-effects{opacity:0}.phase-final{opacity:1}</style>

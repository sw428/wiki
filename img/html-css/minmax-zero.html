<div id="minmax-zero-explanation">
  <style>
    #minmax-zero-explanation { color: var(--foreground); }
    #minmax-zero-explanation .diagram { display: block; width: 100%; background: #ffffff; }
    #minmax-zero-explanation .key { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
    #minmax-zero-explanation svg text { fill: #111111; font-family: sans-serif; font-size: 14px; }
    #minmax-zero-explanation .parent { fill: #f5f5f5; stroke: #666666; stroke-width: 2; stroke-dasharray: 8 7; }
    #minmax-zero-explanation .fixed { fill: #cfe4ff; stroke: #315fa0; }
    #minmax-zero-explanation .flexible { fill: #f8cfd6; stroke: #c93030; }
  </style>
  <div class="key"><code>176px minmax(0, 1fr)</code><span>gap: 28px</span></div>
  <svg class="diagram" role="img" aria-labelledby="minmax-zero-title minmax-zero-desc" height="330">
    <title id="minmax-zero-title">親を狭くすると、可変列は0pxまで縮む</title>
    <desc id="minmax-zero-desc">固定列176px、gap28px、可変列minmax(0,1fr)。親の内容幅604pxでは可変列400px、304pxでは100px、204pxでは0pxになる。可変列0pxは親の右端にある赤い補助線で示す。子の内容・padding・borderはない条件。灰色の点線は親の範囲を示す補助線でCSSのborderではない。</desc>
    <g data-rows></g>
  </svg>
  <script>
    (() => {
      const root = document.getElementById('minmax-zero-explanation');
      const svg = root.querySelector('svg');
      const rows = root.querySelector('[data-rows]');
      const ns = 'http://www.w3.org/2000/svg';
      function element(tag, attributes, text) {
        const item = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, String(value));
        if (text !== undefined) item.textContent = text;
        rows.appendChild(item);
        return item;
      }
      function draw() {
        const width = root.getBoundingClientRect().width;
        if (!width) return;
        svg.setAttribute('viewBox', `0 0 ${width} 330`);
        rows.replaceChildren();
        const scale = (width - 32) / 604;
        [604, 304, 204].forEach((parent, index) => {
          const y = 42 + index * 96;
          const flexible = parent - 176 - 28;
          const start = 16 + 204 * scale;
          element('text', { x: 16, y: y - 15 }, `親の内容幅 ${parent}px`);
          element('rect', { x: 16, y, width: parent * scale, height: 50, class: 'parent' });
          element('rect', { x: 16, y: y + 3, width: 176 * scale, height: 44, class: 'fixed' });
          element('text', { x: 16 + 88 * scale, y: y + 29, 'text-anchor': 'middle' }, '176px');
          if (flexible > 0) {
            element('rect', { x: start, y: y + 3, width: flexible * scale, height: 44, class: 'flexible' });
            if (flexible * scale >= 55) {
              element('text', { x: start + flexible * scale / 2, y: y + 29, 'text-anchor': 'middle' }, `${flexible}px`);
            } else {
              element('text', { x: start + flexible * scale + 9, y: y + 29 }, `${flexible}px`);
            }
          } else {
            element('line', { x1: start, x2: start, y1: y - 3, y2: y + 53, stroke: '#c93030', 'stroke-width': 2 });
            element('text', { x: start + 12, y: y + 29 }, '可変列 0px');
          }
        });
        element('text', { x: 16, y: 322 }, '点線：親の範囲　青：固定列　赤：可変列');
      }
      new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
</div>

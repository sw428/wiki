<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの負のmargin-topで子B・C・Dが40px上へ詰まる</title>
<desc id="desc">通常フローのブロック配置で、子AからDの高さは各100px、ほかの上下marginは0とし、それぞれの箱に子が一つある。子Bにmargin-top: -40pxを指定すると、子B・C・Dとそれぞれの子が指定前から40px上へ移る。子Aとその子の位置は変わらない。指定前から上margin適用後までを14秒周期で繰り返し、動きを減らす設定では適用後の静止図を表示する。色付きの片矢印は各要素の上への移動を示す。箱の外枠と親の灰色点線は識別と範囲の補助表示で、実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。</desc>
<style>text{font-family:"Yu Gothic","Meiryo",sans-serif}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-size:19px;font-family:Consolas,monospace}.phase-before,.phase-top,.phase-applying-top,.phase-applying-bottom,.mid-effects{opacity:0}.phase-final{opacity:1}
@media(prefers-reduced-motion:no-preference){
#stage-2-b,#stage-2-c,#stage-2-d{animation:move-top 14s infinite}
.parent-range{animation:parent-top 14s infinite}
.top-effects,.phase-final{animation:show-top 14s infinite}
.phase-before{animation:before-top 14s infinite}
.phase-applying-top{animation:applying-top 14s infinite}
@keyframes move-top{0%,15%{transform:translateY(80px)}40%,100%{transform:translateY(0)}}
@keyframes parent-top{0%,15%{height:800px}40%,100%{height:720px}}
@keyframes show-top{0%,39%{opacity:0}40%,100%{opacity:1}}
@keyframes before-top{0%,14%{opacity:1}15%,100%{opacity:0}}
@keyframes applying-top{0%,14%{opacity:0}15%,39%{opacity:1}40%,100%{opacity:0}}
}</style>
<defs><marker id="m2-b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c93030" stroke-width="2"/></marker><marker id="m2-c" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker><marker id="m2-d" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#be185d" stroke-width="2"/></marker></defs><rect width="700" height="1000" fill="#ffffff"/><text x="40" y="48" class="heading" fill="#222222">② 上marginのみ</text><text x="40" y="89" class="small phase-before" fill="#222222">指定前</text><text x="40" y="89" class="small phase-applying-top" fill="#222222">上margin適用中</text><text x="40" y="89" class="small phase-final" fill="#222222">上margin適用</text><text x="42" y="131" class="small" fill="#444444">親要素 .parent</text><rect class="parent-range" x="40" y="150" width="620" height="720" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/><g id="stage-2-a"><rect x="70" y="150" width="250" height="200" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="98" y="186" class="label" fill="#315fa0">子A .a</text>
<rect x="108" y="205" width="174" height="45" rx="4" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="133" y="235" class="small" fill="#be185d">子Aの子</text></g><g id="stage-2-b"><rect x="70" y="270" width="250" height="200" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="98" y="306" class="label" fill="#c93030">子B .b</text>
<rect x="108" y="325" width="174" height="45" rx="4" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
<text x="133" y="355" class="small" fill="#a21caf">子Bの子</text></g><g id="stage-2-c"><rect x="70" y="470" width="250" height="200" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="98" y="506" class="label" fill="#7c3aed">子C .c</text>
<rect x="108" y="525" width="174" height="45" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="133" y="555" class="small" fill="#315fa0">子Cの子</text></g><g id="stage-2-d"><rect x="70" y="670" width="250" height="200" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="98" y="706" class="label" fill="#be185d">子D .d</text>
<rect x="108" y="725" width="174" height="45" rx="4" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="133" y="755" class="small" fill="#7c3aed">子Dの子</text></g><g class="top-effects"><text x="393" y="247" class="code" fill="#c93030">margin-top: -40px</text><line x1="365" y1="350" x2="365" y2="270" stroke="#c93030" stroke-width="3" marker-end="url(#m2-b)"/><text x="389" y="318" class="label" fill="#c93030">40px上</text></g><g class="top-effects"><line x1="365" y1="550" x2="365" y2="470" stroke="#7c3aed" stroke-width="3" marker-end="url(#m2-c)"/><text x="389" y="518" class="label" fill="#7c3aed">40px上</text><line x1="365" y1="750" x2="365" y2="670" stroke="#be185d" stroke-width="3" marker-end="url(#m2-d)"/><text x="389" y="718" class="label" fill="#be185d">40px上</text></g></svg>

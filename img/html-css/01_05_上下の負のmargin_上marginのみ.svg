<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
<title id="title">子Bの負のmargin-topで子B・C・Dが40px上へ詰まる</title>
<desc id="desc">通常フローで各兄弟の高さは100px、ほかの上下marginは0。子Bの上端にmargin-top: 0を表示し、子B・C・Dと各子が40px上へ移動した後にmargin-top: -40pxへ切り替える。指定値と境界の補助線は子Bと一緒に動く。子Aとその子は動かない。灰色の点線は子Bが子Aへ重なった面積で、移動に合わせて広がる。14秒周期で繰り返し、動きを減らす設定では指定後の静止図を表示する。移動は説明用のアニメーションで、途中の数値を連続表示するものではない。箱の外枠・親の灰色点線・重なりの点線は補助表示で、実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。各段階の説明を表示して1.5秒待ち、その後2秒かけて移動する。</desc>
<style>text{font-family:"Yu Gothic","Meiryo",sans-serif}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}.code{font-size:19px;font-family:Consolas,monospace}.phase-before,.phase-top,.phase-bottom-before,.phase-applying-top,.phase-applying-bottom,.mid-effects{opacity:0}.phase-final{opacity:1}.top-value-zero,.bottom-value-zero{opacity:0}.top-value-negative,.bottom-value-negative{opacity:1}.top-annotation{opacity:1}
@media(prefers-reduced-motion:no-preference){
#stage-2-b,#stage-2-c,#stage-2-d{animation:move-top 14s infinite}
.parent-range{animation:parent-top 14s infinite}
.top-effects,.phase-final{animation:show-top 14s steps(1,end) infinite}
.phase-before{animation:before-top 14s steps(1,end) infinite}
.phase-applying-top{animation:applying-top 14s steps(1,end) infinite}
.top-value-zero{animation:top-zero 14s steps(1,end) infinite}
.top-value-negative{animation:top-negative 14s steps(1,end) infinite}
.overlap-top{animation:overlap-top 14s infinite,overlap-visible 14s steps(1,end) infinite}
@keyframes move-top{0%,10.714285714%{transform:translateY(80px)}25%,100%{transform:translateY(0)}}
@keyframes parent-top{0%,10.714285714%{height:800px}25%,100%{height:720px}}
@keyframes overlap-top{0%,10.714285714%{height:0px}25%,100%{height:80px}}
@keyframes show-top{0%,24.999992857%{opacity:0}25%,100%{opacity:1}}
@keyframes before-top{0%,10.714278571%{opacity:1}10.714285714%,100%{opacity:0}}
@keyframes applying-top{0%,10.714278571%{opacity:0}10.714285714%,24.999992857%{opacity:1}25%,100%{opacity:0}}
@keyframes top-zero{0%,24.999992857%{opacity:1}25%,100%{opacity:0}}
@keyframes top-negative{0%,24.999992857%{opacity:0}25%,100%{opacity:1}}
@keyframes overlap-visible{0%,10.714278571%{opacity:0}10.714285714%,100%{opacity:1}}
}</style>
<defs><marker id="m2-b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c93030" stroke-width="2"/></marker><marker id="m2-c" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker><marker id="m2-d" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#be185d" stroke-width="2"/></marker><mask id="overlap-2-b" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="1000"><rect width="700" height="1000" fill="white"/><rect x="90" y="282" width="222" height="30" fill="black"/><rect x="106" y="323" width="178" height="49" fill="black"/></mask></defs><rect width="700" height="1000" fill="#ffffff"/><text x="40" y="48" class="heading" fill="#111111" style="fill:#111111">② 子Bに上-margin</text><text style="fill:#444444" x="620" y="131" text-anchor="end" class="small" fill="#444444">親要素 .parent</text><rect class="parent-range" x="40" y="150" width="620" height="720" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/><g id="stage-2-a"><rect x="70" y="150" width="250" height="200" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="98" y="186" class="label" fill="#315fa0" style="fill:#315fa0">子A .a</text>
<rect x="108" y="205" width="174" height="45" rx="4" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="133" y="235" class="small" fill="#be185d" style="fill:#be185d">子Aの子</text></g><g id="stage-2-b"><rect x="70" y="270" width="250" height="200" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="98" y="306" class="label" fill="#c93030" style="fill:#c93030">子B .b</text>
<rect x="108" y="325" width="174" height="45" rx="4" fill="#f3dcf7" stroke="#a21caf" stroke-width="2"/>
<text x="133" y="355" class="small" fill="#a21caf" style="fill:#a21caf">子Bの子</text><rect class="overlap-top" x="70" y="270" width="250" height="80" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="8 7" mask="url(#overlap-2-b)"/><g class="margin-label top-annotation"><path d="M320 270 H385" fill="none" stroke="#c93030" stroke-width="2"/><text x="393" y="277" class="code top-value-zero" fill="#c93030" style="fill:#c93030">margin-top: 0</text><text x="393" y="277" class="code top-value-negative" fill="#c93030" style="fill:#c93030">margin-top: -40px</text></g></g><g id="stage-2-c"><rect x="70" y="470" width="250" height="200" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="98" y="506" class="label" fill="#7c3aed" style="fill:#7c3aed">子C .c</text>
<rect x="108" y="525" width="174" height="45" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
<text x="133" y="555" class="small" fill="#315fa0" style="fill:#315fa0">子Cの子</text></g><g id="stage-2-d"><rect x="70" y="670" width="250" height="200" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="98" y="706" class="label" fill="#be185d" style="fill:#be185d">子D .d</text>
<rect x="108" y="725" width="174" height="45" rx="4" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
<text x="133" y="755" class="small" fill="#7c3aed" style="fill:#7c3aed">子Dの子</text></g><g class="top-effects"><line x1="365" y1="350" x2="365" y2="270" stroke="#c93030" stroke-width="3" marker-end="url(#m2-b)"/><text style="fill:#c93030" x="405" y="318" class="label" fill="#c93030">40px上</text></g><g class="top-effects"><line x1="365" y1="550" x2="365" y2="470" stroke="#7c3aed" stroke-width="3" marker-end="url(#m2-c)"/><text style="fill:#7c3aed" x="405" y="518" class="label" fill="#7c3aed">40px上</text><line x1="365" y1="750" x2="365" y2="670" stroke="#be185d" stroke-width="3" marker-end="url(#m2-d)"/><text style="fill:#be185d" x="405" y="718" class="label" fill="#be185d">40px上</text></g><g id="stage-caption">
<text x="365" y="190" font-size="22" font-weight="600" class="phase-before" fill="#111111" style="fill:#111111"><tspan x="365">上marginで</tspan><tspan x="365" dy="32">子B・C・Dを上へ</tspan></text>
<text x="365" y="190" font-size="22" font-weight="600" class="phase-applying-top" fill="#111111" style="fill:#111111">上margin適用中</text>
<text x="365" y="190" font-size="22" font-weight="600" class="phase-final" fill="#111111" style="fill:#111111">上margin適用</text>
</g></svg>

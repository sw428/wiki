<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 340 205" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">兄弟要素の正の上下marginが相殺した間隔</title>
  <desc id="svgDesc">通常フローの兄弟ブロック要素で、隣接する上下marginが相殺する条件を満たす例。上の要素のmargin-bottom: 40pxと下の要素のmargin-top: 30pxは足し合わせず、大きい方の40pxが実際の間隔になる。オレンジは相殺するmarginの範囲を示す説明用の色で、要素の背景色ではない。箱の色付き外枠は要素を識別する補助表示。</desc>
  <rect width="340" height="205" fill="#ffffff"/>
  <rect x="65" y="12" width="210" height="55" fill="#F9CACA" stroke="#c93030" stroke-width="2"/>
  <text x="170" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#292929" font-weight="600">上の要素</text>

  <!-- 上の要素のmargin-bottom:40px（説明用着色） -->
  <rect x="65" y="67" width="210" height="40" fill="#f9cc9d"/>
  <!-- 下の要素のmargin-top:30px（重なる部分を説明用着色） -->
  <rect x="65" y="77" width="210" height="30" fill="#f9cc9d"/>

      <text x="38" y="91" text-anchor="end" font-family="sans-serif" font-size="12" fill="#c93030">40px</text>

      <text x="299" y="96" font-family="sans-serif" font-size="12" fill="#315fa0">30px</text>

  <rect x="65" y="107" width="210" height="55" fill="#C9E2F9" stroke="#315fa0" stroke-width="2"/>
  <text x="170" y="139" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#292929" font-weight="600">下の要素</text>
  <text x="170" y="189" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#222222" style="fill: #111111">実際の間隔：40px</text>
</svg>

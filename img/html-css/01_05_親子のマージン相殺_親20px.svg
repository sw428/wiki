<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">親の上margin20pxと子の上margin40pxが相殺する</title>
<desc id="desc">通常フローのブロック配置で、親と最初の子の上marginが相殺する条件を満たし、前の要素にはmarginがない例。親のmargin-top: 20pxと子のmargin-top: 40pxが相殺し、大きい方の40pxが前の要素の下端から親と子の上端までの距離になる。親と子の上端はそろう。親のCSSの指定値が40pxに書き換わる意味ではない。オレンジは親の外側の余白を示す説明用の色。灰色の点線は親の範囲を示す補助線で、実際のCSSのborderではない。寸法と配置は模式的に示す。</desc>
<defs>
<marker id="black" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#111111" stroke-width="2"/>
</marker>
<marker id="blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#0d455c" stroke-width="2"/>
</marker>
<marker id="orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b64b00" stroke-width="2"/>
</marker>
<marker id="white" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#ffffff" stroke-width="2"/>
</marker>
<linearGradient id="blueFill" x2="1" y2="1">
<stop stop-color="#d9eaff"/>
<stop offset="1" stop-color="#cfe3fc"/>
</linearGradient>
<linearGradient id="redFill" x2="1" y2="1">
<stop stop-color="#ff8585"/>
<stop offset="1" stop-color="#ff9494"/>
</linearGradient>
<linearGradient id="childFill" x2="1" y2="1">
<stop stop-color="#f9c8cd"/>
<stop offset="1" stop-color="#f3bfc5"/>
</linearGradient>
<linearGradient id="marginFill" x2="1" y2="1">
<stop stop-color="#f9cc9d"/>
<stop offset="1" stop-color="#f9cc9d"/>
</linearGradient>
<linearGradient id="grayPanel" x2="1" y2="1">
<stop stop-color="#f0f1f3"/>
<stop offset="1" stop-color="#e9ebee"/>
</linearGradient>
</defs>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<rect x="0" y="0" width="1024" height="1536" rx="0" fill="#ffffff" />
<rect x="20" y="15" width="984" height="169" rx="24" fill="#e6f3ff" />
<circle cx="133" cy="81" r="41" fill="none" stroke="#075abb" stroke-width="14"/>
<text x="210" y="97" font-size="45" fill="#003b8f" font-weight="700" text-anchor="start" >正しい挙動（親20px・子40px）</text>
<text x="512" y="156" font-size="36" fill="#111" font-weight="400" text-anchor="middle" >（大きい方の40pxが結果になる）</text>
<rect x="80" y="204" width="864" height="365" rx="14" fill="#f7f7f8" stroke="#dbdde1" stroke-width="3" />
<text x="120" y="260" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve">.parent {</text>
<text x="120" y="306" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve" style="fill: #444444">  margin-top: 20px;</text>
<text x="120" y="352" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve">}</text>
<text x="120" y="444" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve">.child {</text>
<text x="120" y="490" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve" style="fill: #c93030">  margin-top: <tspan fill="#c93030" font-weight="700">40px</tspan>;</text>
<text x="120" y="536" font-size="39" fill="#111" font-weight="400" text-anchor="start" font-family="Consolas, Yu Gothic, monospace" xml:space="preserve">}</text>
<rect x="210" y="595" width="704" height="120" rx="0" fill="url(#blueFill)" stroke="#315fa0" stroke-width="3" />
<text x="562" y="676" font-size="43" fill="#001433" font-weight="700" text-anchor="middle" >前の要素</text>
<rect x="210" y="715" width="704" height="160" rx="0" fill="#f9cc9d" />
<rect x="210" y="875" width="704" height="340" rx="0" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="250" y="875" width="624" height="132" rx="0" fill="url(#childFill)" stroke="#f64f61" stroke-width="3" />
<text x="562" y="965" font-size="44" fill="#000" font-weight="700" text-anchor="middle" >子要素</text>
<line x1="210" y1="875" x2="914" y2="875" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<text x="185" y="887" font-size="34" fill="#444444" font-weight="700" text-anchor="end" >親の上端</text>
<text x="562" y="1180" font-size="43" fill="#444444" font-weight="700" text-anchor="middle" >親要素</text>
<line x1="460" y1="715" x2="460" y2="875" stroke="#111" stroke-width="4" marker-start="url(#black)" marker-end="url(#black)"/>
<text x="485" y="810" font-size="49" fill="#000" font-weight="700" text-anchor="start" >40px</text>
<rect x="20" y="1251" width="984" height="274" rx="24" fill="#e6f3ff" />
<text x="512" y="1307" font-size="40" fill="#111" font-weight="400" text-anchor="middle" >親の margin-top: 20px と</text>
<text x="512" y="1360" font-size="40" fill="#111" font-weight="400" text-anchor="middle" >子の margin-top: 40px が相殺し、</text>
<text x="512" y="1415" font-size="40" fill="#111" font-weight="400" text-anchor="middle" >大きい方の40pxが結果になります。</text>
<text x="512" y="1490" font-size="40" fill="#034699" font-weight="700" text-anchor="middle" >親と子の上端は同じ位置になります。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="736" height="693" viewBox="0 0 736 693" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">Gridの列・行・セルと子の幅</title>
<desc id="desc">親の内容幅540px、2列は各256px、gap28pxで固定。子の幅164pxを指定した状態から、widthを外して256pxへ広げ、再指定して164pxへ戻す。変えるのは子の幅だけで、行108pxと子の高さ48pxは固定。列1を薄いシアンの縦帯、行1を薄いオレンジの横帯として示し、交点を1セルと表記する。gapは薄紫のすき間。列の見出しと寸法線はシアン、行の見出しと寸法線はオレンジ、gapの文字と寸法線は紫で区別する。子Cはgapと異なる紅紫。題名と動作説明は太めの黒。各説明を表示して2.5秒以上待ち、3秒で幅を変える。17秒周期。動きを減らす設定では164pxの静止表示。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
<rect x="0" y="0" width="736" height="693" fill="#ffffff"/>
<g id="drawing" transform="translate(0 119)">


<style>text{font-family:"Yu Gothic",Meiryo,sans-serif;font-size:20px;fill:#000000;font-weight:500}.small{font-size:18px}.parent-label{fill:#444444}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.cell{fill:white;stroke:#9ca3af;stroke-width:1.25}.measure{fill:none;stroke:#000000;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}.title,.status{fill:#000000;font-weight:700}.column{fill:#007F99;font-weight:700;font-size:18px}.row{fill:#D66A00;font-weight:700}.column-measure{stroke:#007F99;marker-start:url(#column-arrow);marker-end:url(#column-arrow)}.row-measure{stroke:#D66A00;marker-start:url(#row-arrow);marker-end:url(#row-arrow)}.gap{fill:#7C3AED;font-weight:700}.gap-measure{stroke:#7C3AED;marker-start:url(#gap-arrow);marker-end:url(#gap-arrow)}</style>

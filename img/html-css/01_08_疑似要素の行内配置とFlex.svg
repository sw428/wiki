<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">疑似要素の行内配置とFlexアイテムとしての配置を比較する</title>
<desc id="desc">空の::afterを13px四方の赤い箱として、一行の横書きで比較する。上段は親がinline-blockで、疑似要素が文字の後ろの行内に並び、下端が青いベースラインにそろう。下段は親がinline-flexで、疑似要素がFlexアイテムとして文字の後ろに並び、上下の位置はFlexの整列で決まる。疑似要素にmargin・padding・borderがない例。箱の寸法は4倍、親と文字は模式的に示す。灰色の点線は親の範囲、青い点線はベースラインを示す補助線で、実際のCSSのborderではない。</desc>
<style>text{font-family:"Yu Gothic",Meiryo,sans-serif}</style><defs><mask id="text-clear"><rect x="0" y="0" width="900" height="560" fill="#fff" stroke="none" /><rect x="85" y="170" width="106" height="60" fill="#000" stroke="none" /><rect x="85" y="378" width="106" height="60" fill="#000" stroke="none" /></mask></defs>
<rect x="0" y="0" width="900" height="560" fill="#fff" stroke="none" /><text x="28" y="44" font-size="28" fill="#111111" font-weight="700">疑似要素は、親の内側の規則で並ぶ</text><text x="28" y="95" font-size="25" font-weight="700" fill="#111111">① 行内の配置</text><text x="90" y="132" font-size="20" fill="#444444" font-weight="400">親：inline-block</text><rect x="90" y="154" width="148" height="90" fill="#f5f5f5" stroke="none" /><rect x="90" y="154" width="148" height="90" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#text-clear)"/><text x="90" y="222" font-size="48" fill="#315fa0" font-weight="400">案内</text><rect x="186" y="170" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><circle cx="186" cy="170" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><line x1="186" y1="222" x2="320" y2="222" stroke="#315fa0" stroke-width="2" stroke-dasharray="6 5"/><text style="fill:#111111" x="370" y="189" font-size="23" fill="#111111" font-weight="700">下端がベースラインに揃う</text><text x="370" y="223" font-size="19" font-weight="400" fill="#111111">青い線＝文字の基準線</text><text x="28" y="302" font-size="25" font-weight="700" fill="#111111">② Flexの配置</text><text x="90" y="339" font-size="20" fill="#444444" font-weight="400">親：inline-flex</text><rect x="90" y="362" width="148" height="90" fill="#f5f5f5" stroke="none" /><rect x="90" y="362" width="148" height="90" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7" mask="url(#text-clear)"/><text x="90" y="430" font-size="48" fill="#315fa0" font-weight="400">案内</text><rect x="186" y="362" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><circle cx="186" cy="362" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><text style="fill:#111111" x="370" y="402" font-size="23" fill="#111111" font-weight="700">Flexの規則で並ぶ</text><text x="370" y="436" font-size="19" font-weight="400" fill="#111111">上下の位置はFlexの整列で決まる</text><text x="28" y="524" font-size="18" font-weight="400" fill="#111111">赤い箱は13px四方を4倍で表示。親と文字は模式的。</text></svg>

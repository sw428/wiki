<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img"><title>07｜flow と flow-root</title><defs><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}</style><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#536579"/></marker></defs><rect x="0" y="0" width="960" height="565" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="32" y="51" font-size="34" fill="#172b40" font-weight="700" text-anchor="start">07｜flow と flow-root</text><text x="32" y="86" font-size="20" fill="#536579" font-weight="400" text-anchor="start">通常フローの並べ方は同じ。独立した BFC を作るかが違う。</text><rect x="32" y="110" width="438" height="365" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="52" y="144" font-size="23" fill="#2563ad" font-weight="700" text-anchor="start">flow</text><rect x="52" y="160" width="398" height="290" rx="8" fill="#eff5ff" stroke="#2563ad" stroke-width="2" stroke-dasharray="7 4"/><text x="67" y="187" font-size="20" fill="#2563ad" font-weight="700" text-anchor="start">外側の BFC</text><rect x="72" y="205" width="358" height="45" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="251.0" y="234.3" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">兄弟要素</text><rect x="72" y="268" width="358" height="156" rx="7" fill="#f5f8fc" stroke="#536579" stroke-width="2" stroke-dasharray="6 5"/><text x="87" y="296" font-size="21" fill="#2563ad" font-weight="700" text-anchor="start">既存の BFC を利用</text><rect x="87" y="310" width="328" height="43" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="251.0" y="338.3" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">子要素 A</text><rect x="87" y="363" width="328" height="43" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="251.0" y="391.3" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">子要素 B</text><rect x="490" y="110" width="438" height="365" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="510" y="144" font-size="23" fill="#16805b" font-weight="700" text-anchor="start">flow-root</text><rect x="510" y="160" width="398" height="290" rx="8" fill="#eff5ff" stroke="#2563ad" stroke-width="2" stroke-dasharray="7 4"/><text x="525" y="187" font-size="20" fill="#2563ad" font-weight="700" text-anchor="start">外側の BFC</text><rect x="530" y="205" width="358" height="45" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="709.0" y="234.3" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">兄弟要素</text><rect x="530" y="268" width="358" height="156" rx="7" fill="#eefaf3" stroke="#16805b" stroke-width="2"/><text x="545" y="296" font-size="21" fill="#16805b" font-weight="700" text-anchor="start">独立した BFC</text><rect x="545" y="310" width="328" height="43" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="1.5"/><text x="709.0" y="338.3" font-size="20" fill="#16805b" font-weight="400" text-anchor="middle">子要素 A</text><rect x="545" y="363" width="328" height="43" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="1.5"/><text x="709.0" y="391.3" font-size="20" fill="#16805b" font-weight="400" text-anchor="middle">子要素 B</text><path d="M32 512L928 512" stroke="#d5dfe8" stroke-width="2" fill="none"/><text x="32" y="542" font-size="18" fill="#536579" font-weight="400" text-anchor="start">flow-root は通常フローの新しい起点。箱自体は外側の配置に参加する。</text></svg>
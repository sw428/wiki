<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" role="img"><title>03  inline-blockも内側は通常フロー</title><rect x="0" y="0" width="1000" height="690" rx="0" fill="white" stroke="none" stroke-width="1.5"/><text x="40" y="55" font-size="32" fill="#1e293b" font-weight="700" text-anchor="start">03  inline-blockも内側は通常フロー</text><text x="40" y="92" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">外側は親のIFCに参加。内側は flow-root なので独立したBFCを作る。</text><path d="M40 113L960 113" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="139" width="450" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="172" font-size="23" fill="#1e293b" font-weight="700" text-anchor="start">A. インラインの子</text><text x="58" y="203" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">親のIFC（外側の横の流れ）</text><rect x="57" y="218" width="416" height="252" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="65" y="424" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">文字</text><text x="419" y="424" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">文字</text><rect x="116" y="240" width="298" height="194" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="265" y="268" font-size="21" fill="#15803d" font-weight="700" text-anchor="middle">inline-block</text><text x="265" y="295" font-size="16" fill="#15803d" font-weight="400" text-anchor="middle">独立したBFCの境界</text><rect x="128" y="310" width="274" height="78" rx="4" fill="white" stroke="#15803d" stroke-width="1.2" stroke-dasharray="5 4"/><text x="139" y="331" font-size="15" fill="#15803d" font-weight="700" text-anchor="start">内側のIFC</text><rect x="137" y="340" width="78" height="36" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="176.0" y="365.0" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">文字A</text><rect x="223" y="340" width="78" height="36" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="262.0" y="365.0" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">文字B</text><rect x="309" y="340" width="78" height="36" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="348.0" y="365.0" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">文字C</text><path d="M142 410L384 410" fill="none" stroke="#15803d" stroke-width="2"/><path d="M375.5 415.2 L384 410 L375.5 404.8" stroke="#15803d" stroke-width="2" fill="none"/><path d="M62 443L468 443" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 4"/><text x="265" y="459" font-size="14" fill="#2563eb" font-weight="400" text-anchor="middle">行ボックス</text><text x="265" y="504" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">IFCで横に並ぶ</text><rect x="510" y="139" width="450" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="528" y="172" font-size="23" fill="#1e293b" font-weight="700" text-anchor="start">B. ブロックの子</text><text x="528" y="203" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">親のIFC（外側の横の流れ）</text><rect x="527" y="218" width="416" height="252" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="535" y="424" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">文字</text><text x="889" y="424" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">文字</text><rect x="586" y="240" width="298" height="194" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="735" y="268" font-size="21" fill="#15803d" font-weight="700" text-anchor="middle">inline-block</text><text x="735" y="295" font-size="16" fill="#15803d" font-weight="400" text-anchor="middle">独立したBFCの境界</text><rect x="599" y="306" width="245" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="721.5" y="327.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落A</text><rect x="599" y="341" width="245" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="721.5" y="362.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落B</text><rect x="599" y="376" width="245" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="721.5" y="397.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落C</text><path d="M860 307L860 402" fill="none" stroke="#15803d" stroke-width="2"/><path d="M854.8 393.5 L860 402 L865.2 393.5" stroke="#15803d" stroke-width="2" fill="none"/><path d="M532 443L938 443" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 4"/><text x="735" y="459" font-size="14" fill="#2563eb" font-weight="400" text-anchor="middle">行ボックス</text><text x="735" y="504" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">BFCの規則で縦に並ぶ</text><rect x="40" y="554" width="920" height="101" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="587" font-size="23" fill="#1e293b" font-weight="700" text-anchor="start">display: inline-block ＝ display: inline flow-root</text><text x="60" y="622" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">flow-root は内側を独立させる。横・縦の並べ方は通常フローのまま。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" role="img"><title>02  blockの内側がブロック配置になる場合</title><rect x="0" y="0" width="1000" height="650" rx="0" fill="white" stroke="none" stroke-width="1.5"/><text x="40" y="55" font-size="32" fill="#1e293b" font-weight="700" text-anchor="start">02  blockの内側がブロック配置になる場合</text><text x="40" y="92" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">外側は同じ block。内側は子要素に応じて通常フローで配置する。</text><path d="M40 113L960 113" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="138" width="315" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="173" font-size="23" fill="#64748b" font-weight="700" text-anchor="start">HTML</text><text x="60" y="222" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">&lt;div&gt;</text><text x="60" y="260" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">  &lt;p&gt;段落A&lt;/p&gt;</text><text x="60" y="298" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">  &lt;p&gt;段落B&lt;/p&gt;</text><text x="60" y="336" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">  &lt;p&gt;段落C&lt;/p&gt;</text><text x="60" y="374" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">&lt;/div&gt;</text><text x="60" y="457" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">div：display: block</text><rect x="377" y="138" width="583" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="395" y="168" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start">親のBFC（外側の縦の流れ）</text><rect x="395" y="182" width="515" height="35" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="652" y="205" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">前のブロック</text><rect x="395" y="229" width="515" height="208" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="411" y="257" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">div：外側 block / 内側 flow</text><rect x="411" y="269" width="483" height="151" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="7 5"/><text x="425" y="295" font-size="19" fill="#15803d" font-weight="700" text-anchor="start">BFCの規則：縦方向に並ぶ</text><rect x="425" y="305" width="414" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="632.0" y="326.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落A</text><rect x="425" y="339" width="414" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="632.0" y="360.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落B</text><rect x="425" y="373" width="414" height="29" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="632.0" y="394.5" font-size="20" fill="#1e293b" font-weight="400" text-anchor="middle">段落C</text><path d="M864 307L864 403" fill="none" stroke="#15803d" stroke-width="2"/><path d="M858.8 394.5 L864 403 L869.2 394.5" stroke="#15803d" stroke-width="2" fill="none"/><rect x="395" y="449" width="515" height="35" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="652" y="472" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">後のブロック</text><path d="M934 190L934 476" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M928.8 467.5 L934 476 L939.2 467.5" stroke="#2563eb" stroke-width="2" fill="none"/><rect x="40" y="522" width="920" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="555" font-size="20" fill="#15803d" font-weight="700" text-anchor="start">ポイント</text><text x="190" y="555" font-size="20" fill="#1e293b" font-weight="400" text-anchor="start">外側はブロックレベル。内側はブロック整形コンテキストの配置規則。</text><text x="60" y="588" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">display: block だけでは、原則として新しいBFCを作らない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="569" viewBox="0 0 400 569" role="img" aria-labelledby="title desc">
  <title id="title">図② 同じリンクの内側を3段階で比べる</title>
  <desc id="desc">Aのinline-blockでは通常の行で矢印画像と文字が並び、HTMLの空白が間に見える。Bはdisplayだけをinline-flexに変え、imgとspanがFlexアイテムになる。Cはgap 10pxを加え、二つの箱の縦の中心をalign-items centerで揃える。明るい青の背景はリンクの箱。位置と間隔は模式的に示す。</desc>
  <defs>
    <g id="icon">
      <rect width="30" height="30" rx="4" fill="#ffeed5" stroke="#b77423"/>
      <path d="M7 15h16m-6-6 6 6-6 6" fill="none" stroke="#875211" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <style>
      text {font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#172a40}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .copy {font-size:16px}
      .note {font-size:15px;fill:#425a72}
      .code {font-family:Consolas,"Noto Sans Mono",monospace;font-size:16px;font-weight:600}
      .stage {fill:#f8fafc;stroke:#d5e0eb}
      .link {fill:#eaf2ff;stroke:#52739a}
      .text-item {fill:#d6e7ff;stroke:#7396bd}
      .callout {stroke:#5b7490;fill:none}
    </style>
  </defs>
  <rect width="400" height="569" fill="#fff"/>
  <text class="head" x="17" y="32">図② リンクの中で何が変わる？</text>
  <text class="copy" x="17" y="57">HTMLは同じ。淡い青はリンクの箱。</text>

  <rect class="stage" x="13" y="75" width="374" height="139" rx="10"/>
  <text class="label" x="28" y="104">A　通常の行で並べる</text>
  <text class="code" x="28" y="130">display: inline-block</text>
  <rect class="link" x="27" y="143" width="173" height="54" rx="6"/>
  <use href="#icon" x="44" y="151"/>
  <text class="copy" x="82" y="180">詳しく見る</text>
  <path d="M43 181H248" stroke="#7c6041" stroke-dasharray="4 3"/>
  <path class="callout" d="M78 163v-22H230l18 8"/>
  <text class="note" x="253" y="153">HTMLの空白</text>
  <text class="note" x="253" y="187">行のベースライン</text>

  <rect class="stage" x="13" y="225" width="374" height="139" rx="10"/>
  <text class="label" x="28" y="254">B　Flexの並びに切り替える</text>
  <text class="code" x="28" y="280">display: inline-flex</text>
  <rect class="link" x="27" y="293" width="165" height="54" rx="6"/>
  <use href="#icon" x="44" y="301"/>
  <rect class="text-item" x="74" y="301" width="101" height="38" rx="4"/>
  <text class="copy" x="82" y="325">詳しく見る</text>
  <text class="note" x="253" y="312">隣り合う二つの</text>
  <text class="note" x="253" y="335">Flexアイテム</text>

  <rect class="stage" x="13" y="375" width="374" height="158" rx="10"/>
  <text class="label" x="28" y="404">C　箱の中心と間隔を揃える</text>
  <text class="code" x="28" y="430">align-items: center</text>
  <text class="code" x="28" y="452">gap: 10px</text>
  <rect class="link" x="27" y="462" width="175" height="54" rx="6"/>
  <use href="#icon" x="44" y="474"/>
  <rect class="text-item" x="84" y="470" width="101" height="38" rx="4"/>
  <text class="copy" x="92" y="495">詳しく見る</text>
  <path d="M37 489H43M74 489H84M185 489H244" stroke="#285480" stroke-dasharray="4 4" opacity=".55"/>
  <text class="note" x="253" y="484">箱の縦の中心</text>
  <path d="M74 503v6m10-6v6m-10-3h10" stroke="#52739a"/>
  <text class="note" x="253" y="510">箱の間は10px</text>
  <path class="callout" d="M79 509v14h155l12-16"/>

  <text class="note" x="17" y="555">位置と間隔を説明する模式図です。</text>
</svg>

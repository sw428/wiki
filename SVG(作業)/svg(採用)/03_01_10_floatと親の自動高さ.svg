<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img"><title>08｜float の影響を内側に閉じる</title><defs><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}</style><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#536579"/></marker></defs><rect x="0" y="0" width="960" height="555" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="32" y="51" font-size="34" fill="#172b40" font-weight="700" text-anchor="start">08｜float の影響を内側に閉じる</text><text x="32" y="86" font-size="20" fill="#536579" font-weight="400" text-anchor="start">flow-root が必要になる代表例：float された画像</text><rect x="32" y="110" width="438" height="355" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="52" y="144" font-size="23" fill="#2563ad" font-weight="700" text-anchor="start">flow</text><rect x="49" y="161" width="404" height="285" rx="7" fill="#fff" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="62" y="180" width="378" height="91" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="2"/><text x="72" y="203" font-size="18" fill="#2563ad" font-weight="700" text-anchor="start">親ボックス</text><rect x="74" y="215" width="130" height="145" rx="5" fill="#fff2db" stroke="#b7791f" stroke-width="1.5"/><text x="139.0" y="293.96" font-size="19" fill="#b7791f" font-weight="400" text-anchor="middle">float 画像</text><text x="216" y="239" font-size="19" fill="#172b40" font-weight="400" text-anchor="start">内側の文章</text><path d="M216 251L422 251" stroke="#536579" stroke-width="2" fill="none"/><text x="216" y="303" font-size="19" fill="#b83b39" font-weight="700" text-anchor="start">外側の文章も</text><text x="216" y="330" font-size="19" fill="#b83b39" font-weight="700" text-anchor="start">回り込む</text><text x="74" y="405" font-size="19" fill="#b83b39" font-weight="400" text-anchor="start">親の高さからはみ出す</text><rect x="490" y="110" width="438" height="355" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="510" y="144" font-size="23" fill="#16805b" font-weight="700" text-anchor="start">flow-root</text><rect x="507" y="161" width="404" height="285" rx="7" fill="#fff" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="520" y="180" width="378" height="194" rx="5" fill="#eefaf3" stroke="#16805b" stroke-width="2"/><text x="530" y="203" font-size="18" fill="#16805b" font-weight="700" text-anchor="start">親ボックス</text><rect x="532" y="215" width="130" height="145" rx="5" fill="#fff2db" stroke="#b7791f" stroke-width="1.5"/><text x="597.0" y="293.96" font-size="19" fill="#b7791f" font-weight="400" text-anchor="middle">float 画像</text><text x="674" y="239" font-size="19" fill="#172b40" font-weight="400" text-anchor="start">内側の文章</text><path d="M674 251L880 251" stroke="#536579" stroke-width="2" fill="none"/><text x="532" y="406" font-size="20" fill="#16805b" font-weight="700" text-anchor="start">外側の文章は箱の下へ</text><path d="M532 421L880 421" stroke="#536579" stroke-width="2" fill="none"/><path d="M32 502L928 502" stroke="#d5dfe8" stroke-width="2" fill="none"/><text x="32" y="532" font-size="18" fill="#536579" font-weight="400" text-anchor="start">独立した BFC は内部の float を自動高さに含め、回り込みを内側に限定する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img"><title>10｜不可分（atomic）なインラインボックス</title><defs><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}</style><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#536579"/></marker></defs><rect x="0" y="0" width="960" height="625" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="32" y="51" font-size="34" fill="#172b40" font-weight="700" text-anchor="start">10｜不可分（atomic）なインラインボックス</text><text x="32" y="86" font-size="20" fill="#536579" font-weight="400" text-anchor="start">外側の行で箱が途中分割されるかどうか</text><rect x="32" y="110" width="896" height="208" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="52" y="144" font-size="23" fill="#2563ad" font-weight="700" text-anchor="start">inline：行の途中で折り返せる</text><rect x="52" y="159" width="856" height="55" rx="4" fill="white" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="52" y="231" width="856" height="55" rx="4" fill="white" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="6 4"/><text x="66" y="194" font-size="22" fill="#172b40" font-weight="400" text-anchor="start">前の文章</text><rect x="220" y="166" width="672" height="40" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="556.0" y="192.8" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">インライン要素の前半</text><rect x="65" y="238" width="430" height="40" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="280.0" y="264.8" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">インライン要素の後半</text><text x="520" y="266" font-size="22" fill="#172b40" font-weight="400" text-anchor="start">後の文章</text><rect x="32" y="335" width="896" height="218" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="52" y="369" font-size="23" fill="#16805b" font-weight="700" text-anchor="start">inline-block：箱全体が次の行へ</text><rect x="52" y="385" width="856" height="45" rx="4" fill="white" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="6 4"/><text x="66" y="415" font-size="22" fill="#172b40" font-weight="400" text-anchor="start">前の文章</text><text x="360" y="415" font-size="20" fill="#536579" font-weight="400" text-anchor="start">残り幅に収まらない</text><path d="M665 410L665 445" stroke="#536579" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="52" y="447" width="856" height="87" rx="4" fill="white" stroke="#9aaabc" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="65" y="453" width="670" height="75" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="2"/><rect x="78" y="460" width="644" height="27" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="1.5"/><text x="400.0" y="478.94" font-size="16" fill="#16805b" font-weight="400" text-anchor="middle">子要素 A</text><rect x="78" y="492" width="644" height="27" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="1.5"/><text x="400.0" y="510.94" font-size="16" fill="#16805b" font-weight="400" text-anchor="middle">子要素 B</text><text x="755" y="510" font-size="21" fill="#172b40" font-weight="400" text-anchor="start">後の文字</text><path d="M32 572L928 572" stroke="#d5dfe8" stroke-width="2" fill="none"/><text x="32" y="602" font-size="18" fill="#536579" font-weight="400" text-anchor="start">不可分とは外側の行での分割の話。内側の文字は折り返せる。</text></svg>
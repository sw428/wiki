<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 556" width="720" height="1112" role="img" aria-label="CSS Gridの1frとmax-contentを比較。破線は列の範囲、塗りつぶしは子要素。1frでは3列が等幅で子は列いっぱいに広がる。max-contentでは各列が内容の幅を基準に作られ、子はその列の幅まで広がる。">
<style>
 .title {font:700 14px "Noto Sans CJK JP",sans-serif;fill:#26334b}
 .body {font:12px "Noto Sans CJK JP",sans-serif;fill:#18334c}
 .small {font:11px "Noto Sans CJK JP",sans-serif;fill:#52647b}
 .cap {font:600 11px "Noto Sans CJK JP",sans-serif;fill:#3c566d}
 .colname {font:600 10px "Noto Sans CJK JP",sans-serif;text-anchor:middle;fill:#42587d}
 .measure {font:600 10px "Noto Sans CJK JP",sans-serif;fill:#426594;text-anchor:middle}
</style>
<rect width="360" height="556" fill="#fff" rx="10"/>
<g transform="translate(0 0)">
<!-- 1fr -->
<text class="title" x="14" y="27">repeat(3, 1fr);</text>
<text class="small" x="14" y="44">列を3等分 → 子が列いっぱいに広がる</text>
<rect x="13" y="57" width="334" height="138" rx="8" fill="#f9fbff" stroke="#c4d0de"/>
<!-- 列（破線）: 上段の3列は同じ幅 -->
<g fill="#eff5ff" stroke="#6689b6" stroke-width="1.5" stroke-dasharray="4 3">
 <rect x="19" y="64" width="102" height="123" rx="5"/>
 <rect x="129" y="64" width="102" height="123" rx="5"/>
 <rect x="239" y="64" width="102" height="123" rx="5"/>
</g>
<text class="colname" x="70" y="80">1列目</text>
<text class="colname" x="180" y="80">2列目</text>
<text class="colname" x="290" y="80">3列目</text>
<!-- 子要素（塗りつぶし） -->
<g fill="#dceafe" stroke="#7ba7e9">
 <rect x="19" y="88" width="102" height="42" rx="6"/>
 <rect x="19" y="138" width="102" height="42" rx="6"/>
 <rect x="129" y="88" width="102" height="42" rx="6"/>
 <rect x="129" y="138" width="102" height="42" rx="6"/>
 <rect x="239" y="88" width="102" height="42" rx="6"/>
 <rect x="239" y="138" width="102" height="42" rx="6"/>
</g>
<g class="body">
 <text x="27" y="114">テキスト</text>
 <text x="27" y="164">テキスト</text>
 <text x="137" y="105">サンプル文字</text><text x="137" y="120">の確認</text>
 <text x="137" y="164">テキスト</text>
 <text x="247" y="114">テキストの例</text>
 <text x="247" y="164">テキストの例</text>
</g>
<g stroke="#7c9ed1" stroke-width="1.2" stroke-linecap="round">
 <path d="M19 202v7 M121 202v7 M19 205.5H121"/>
 <path d="M129 202v7 M231 202v7 M129 205.5H231"/>
 <path d="M239 202v7 M341 202v7 M239 205.5H341"/>
</g>
<text class="measure" x="70" y="222">同じ列幅</text>
<text class="measure" x="180" y="222">同じ列幅</text>
<text class="measure" x="290" y="222">同じ列幅</text>
<text class="cap" x="14" y="244">justify-items: normal;</text>
<text class="small" x="14" y="261">通常は stretch と同じく、子が列幅まで伸びる</text>
<line x1="13" y1="278" x2="347" y2="278" stroke="#d5dce6"/>
</g>
<g transform="translate(0 0)">
<!-- max-content -->
<text class="title" x="14" y="302">repeat(3, max-content);</text>
<text class="small" x="14" y="319">内容の幅を基準に、列そのものが作られる</text>
<rect x="13" y="331" width="334" height="138" rx="8" fill="#fbfffd" stroke="#c4d0de"/>
<!-- 列（破線）: 各列の幅が異なる -->
<g fill="#eafaf1" stroke="#4eab80" stroke-width="1.5" stroke-dasharray="4 3">
 <rect x="19" y="338" width="62" height="123" rx="5"/>
 <rect x="92" y="338" width="122" height="123" rx="5"/>
 <rect x="225" y="338" width="86" height="123" rx="5"/>
</g>
<text class="colname" x="50" y="354">1列目</text>
<text class="colname" x="153" y="354">2列目</text>
<text class="colname" x="268" y="354">3列目</text>
<text class="small" x="315" y="408" font-size="9">余白</text>
<!-- 子要素（塗りつぶし） -->
<g fill="#d8f6e8" stroke="#6bbf96">
 <rect x="19" y="362" width="62" height="42" rx="6"/>
 <rect x="19" y="412" width="62" height="42" rx="6"/>
 <rect x="92" y="362" width="122" height="42" rx="6"/>
 <rect x="92" y="412" width="122" height="42" rx="6"/>
 <rect x="225" y="362" width="86" height="42" rx="6"/>
 <rect x="225" y="412" width="86" height="42" rx="6"/>
</g>
<g class="body">
 <text x="26" y="388">テキスト</text>
 <text x="26" y="438">テキスト</text>
 <text x="99" y="388">サンプル文字の確認</text>
 <text x="99" y="438">テキスト</text>
 <text x="232" y="388">テキストの例</text>
 <text x="232" y="438">テキストの例</text>
</g>
<text class="small" style="font-size:10px" x="225" y="490"><tspan x="225">※ 列幅は各列で</tspan><tspan x="235" dy="15">最も幅が必要な</tspan><tspan x="235" dy="15">内容を基準にする</tspan></text>
<text class="cap" x="14" y="487">justify-items: normal;</text>
<text class="small" x="14" y="507">子要素の箱は、この列幅まで広がる</text>
</g>
<g transform="translate(0 12)">
<g font-family="Noto Sans CJK JP,sans-serif" font-size="10" fill="#52647b">
 <rect x="14" y="523" width="11" height="11" rx="2" fill="none" stroke="#6689b6" stroke-dasharray="3 2"/>
 <text x="30" y="532">破線の枠 = 列</text>
 <rect x="140" y="523" width="11" height="11" rx="2" fill="#dceafe" stroke="#7ba7e9"/>
 <rect x="155" y="523" width="11" height="11" rx="2" fill="#d8f6e8" stroke="#6bbf96"/>
 <text x="173" y="532">濃い色の箱 = 子要素</text>
</g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img"><title>09｜親子の margin 相殺</title><defs><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}</style><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#536579"/></marker></defs><rect x="0" y="0" width="960" height="535" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="32" y="51" font-size="34" fill="#172b40" font-weight="700" text-anchor="start">09｜親子の margin 相殺</text><text x="32" y="86" font-size="20" fill="#536579" font-weight="400" text-anchor="start">flow-root で親と子の上下マージンの相殺を防ぐ</text><rect x="32" y="110" width="438" height="338" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="52" y="144" font-size="23" fill="#2563ad" font-weight="700" text-anchor="start">flow</text><rect x="62" y="245" width="378" height="152" rx="0" fill="#edf4ff" stroke="#2563ad" stroke-width="2" stroke-dasharray="7 4"/><rect x="77" y="177" width="348" height="68" rx="0" fill="#fff1d8" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="251" y="218" font-size="21" fill="#b7791f" font-weight="700" text-anchor="middle">子の margin-top</text><rect x="77" y="245" width="348" height="125" rx="5" fill="#e9f2ff" stroke="#2563ad" stroke-width="1.5"/><text x="251.0" y="314.3" font-size="20" fill="#2563ad" font-weight="400" text-anchor="middle">子要素</text><text x="251" y="425" font-size="20" fill="#2563ad" font-weight="700" text-anchor="middle">親の外側に現れる</text><rect x="490" y="110" width="438" height="338" rx="12" fill="#f9fbfd" stroke="#c9d5e0" stroke-width="1.5"/><text x="510" y="144" font-size="23" fill="#16805b" font-weight="700" text-anchor="start">flow-root</text><rect x="520" y="177" width="378" height="220" rx="0" fill="#eefaf3" stroke="#16805b" stroke-width="2" stroke-dasharray="7 4"/><rect x="535" y="177" width="348" height="68" rx="0" fill="#fff1d8" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="709" y="218" font-size="21" fill="#b7791f" font-weight="700" text-anchor="middle">子の margin-top</text><rect x="535" y="245" width="348" height="125" rx="5" fill="#e8f7ee" stroke="#16805b" stroke-width="1.5"/><text x="709.0" y="314.3" font-size="20" fill="#16805b" font-weight="400" text-anchor="middle">子要素</text><text x="709" y="425" font-size="20" fill="#16805b" font-weight="700" text-anchor="middle">親の内側に残る</text><path d="M32 482L928 482" stroke="#d5dfe8" stroke-width="2" fill="none"/><text x="32" y="512" font-size="18" fill="#536579" font-weight="400" text-anchor="start">親に border・padding がない例。兄弟同士の margin 相殺は別の話。</text></svg>
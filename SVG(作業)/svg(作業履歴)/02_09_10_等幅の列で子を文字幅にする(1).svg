<svg xmlns="http://www.w3.org/2000/svg" width="720" height="552" viewBox="0 0 360 276" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">等幅の列で子要素の背景だけを文字幅にする</title><desc id="desc">親の3列はいずれも同じ幅。justify-items startにより、同じ列の上下の子要素も、それぞれ内容とpaddingに応じた幅になる。</desc><rect x="0" y="0" width="360" height="276" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><g><text x="16" y="27" fill="#1E3653" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="16" font-weight="700">同じ列の中でも、背景幅は別々</text><text x="16" y="50" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="400">1fr × 3列 ＋ justify-items: start</text><rect x="15" y="72" width="102" height="120" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="129" y="72" width="102" height="120" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="243" y="72" width="102" height="120" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="15" y="80" width="64" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="47.0" y="102.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">テキスト</text><rect x="15" y="145" width="100" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="65.0" y="167.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">テキストの例</text><rect x="129" y="80" width="64" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="161.0" y="102.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">テキスト</text><rect x="129" y="145" width="64" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="161.0" y="167.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">テキスト</text><rect x="243" y="80" width="40" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="263.0" y="102.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">文字</text><rect x="243" y="145" width="64" height="35" rx="4" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="275.0" y="167.5" fill="#153E66" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="12" font-weight="500" text-anchor="middle">テキスト</text><text x="66" y="211" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="600" text-anchor="middle">1fr</text><text x="180" y="211" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="600" text-anchor="middle">1fr</text><text x="294" y="211" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="600" text-anchor="middle">1fr</text><rect x="16" y="228" width="11" height="11" rx="2" fill="none" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="3 2" /><text x="33" y="238" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="400">＝列</text><rect x="16" y="248" width="11" height="11" rx="2" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="33" y="258" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="400">＝子の箱</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="812" viewBox="0 0 360 406" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">列幅を変えずに長い文字を折り返す</title><desc id="desc">同じ2列幅を保つ。改行しない一続きの英字は隣の列へはみ出すが、overflow-wrap anywhereを指定した後は同じ列の中で複数行になる。</desc><rect x="0" y="0" width="360" height="406" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><g><text x="16" y="27" fill="#1E3653" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="16" font-weight="700">列が収まっても、文字ははみ出せる</text><text x="16" y="54" fill="#1E3653" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="15" font-weight="700">① 改行できない文字列</text><rect x="16" y="73" width="150" height="92" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="188" y="73" width="150" height="92" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="16" y="90" width="150" height="59" rx="3" fill="#FBE4E5" stroke="#C77070" stroke-width="1" /><rect x="188" y="90" width="150" height="59" rx="3" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="24" y="120" fill="#A23D43" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="500">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text><text x="16" y="186" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="400">文字が列の境界を越えてしまう</text><line x1="16" y1="209" x2="344" y2="209" stroke="#D9E3ED" stroke-width="1"/><text x="16" y="238" fill="#1E3653" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="15" font-weight="700">② overflow-wrap: anywhere</text><rect x="16" y="256" width="150" height="102" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="188" y="256" width="150" height="102" rx="4" fill="#F4F8FC" stroke="#91A6BE" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="16" y="274" width="150" height="69" rx="3" fill="#FBE4E5" stroke="#C77070" stroke-width="1" /><rect x="188" y="274" width="150" height="69" rx="3" fill="#DCEBFF" stroke="#4D8FCE" stroke-width="1" /><text x="24" y="296" fill="#A23D43" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="500">ABCDEFGHIJKLMNOP</text><text x="24" y="318" fill="#A23D43" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="500">QRSTUVWXYZ</text><text x="16" y="383" fill="#435873" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13" font-weight="400">列幅はそのまま、文字だけ折り返す</text></g></svg>
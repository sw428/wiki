<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1524" viewBox="0 0 360 762" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Gridの列とjustify-selfによる子要素の配置</title>
<desc id="desc">指定なしでは背景が列幅いっぱいに広がる。startは左、centerは中央、endは右端に子要素が配置される。いずれもGridの列自体の幅は同じ。</desc>
<rect width="360" height="762" fill="#FFFFFF" rx="10"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<text x="18" y="32" font-size="18" font-weight="700" fill="#26334b">列は同じ。背景の位置を変える</text>
<g font-size="12.5" fill="#52647b">
<rect x="19" y="51" width="17" height="14" rx="2" fill="#eff5ff" stroke="#6689b6" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="43" y="63">Gridの列</text>
<rect x="148" y="51" width="17" height="14" rx="2" fill="#dceafe" stroke="#7ba7e9" stroke-width="1"/>
<text x="172" y="63">子要素の背景</text></g>
<g>
<text x="19" y="100" font-size="15" font-weight="700" fill="#26334b">指定なし</text>
<text x="19" y="121" font-size="13" fill="#52647b">背景が列いっぱいに広がる</text>
<rect x="36" y="138" width="288" height="77" rx="5" fill="#eff5ff" stroke="#6689b6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="36" y="152" width="288" height="49" fill="#dceafe" stroke="#7ba7e9" stroke-width="1" rx="6"/>
<text x="53" y="183" font-size="12" font-weight="500" fill="#18334c">テキスト</text>
</g>
<line x1="19" y1="229" x2="341" y2="229" stroke="#d5dce6" stroke-width="1"/>
<g>
<text x="19" y="253" font-size="15" font-weight="700" fill="#26334b">justify-self: start</text>
<text x="19" y="274" font-size="13" fill="#52647b">小さな背景を左端に置く</text>
<rect x="36" y="291" width="288" height="77" rx="5" fill="#eff5ff" stroke="#6689b6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="36" y="305" width="78" height="49" fill="#dceafe" stroke="#7ba7e9" stroke-width="1" rx="6"/>
<text x="53" y="336" font-size="12" font-weight="500" fill="#18334c">テキスト</text>
</g>
<line x1="19" y1="382" x2="341" y2="382" stroke="#d5dce6" stroke-width="1"/>
<g>
<text x="19" y="406" font-size="15" font-weight="700" fill="#26334b">justify-self: center</text>
<text x="19" y="427" font-size="13" fill="#52647b">小さな背景を中央に置く</text>
<rect x="36" y="444" width="288" height="77" rx="5" fill="#eff5ff" stroke="#6689b6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="141.0" y="458" width="78" height="49" fill="#dceafe" stroke="#7ba7e9" stroke-width="1" rx="6"/>
<text x="158.0" y="489" font-size="12" font-weight="500" fill="#18334c">テキスト</text>
</g>
<line x1="19" y1="535" x2="341" y2="535" stroke="#d5dce6" stroke-width="1"/>
<g>
<text x="19" y="559" font-size="15" font-weight="700" fill="#26334b">justify-self: end</text>
<text x="19" y="580" font-size="13" fill="#52647b">小さな背景を右端に置く</text>
<rect x="36" y="597" width="288" height="77" rx="5" fill="#eff5ff" stroke="#6689b6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="246" y="611" width="78" height="49" fill="#dceafe" stroke="#7ba7e9" stroke-width="1" rx="6"/>
<text x="263" y="642" font-size="12" font-weight="500" fill="#18334c">テキスト</text>
</g>
<text x="180" y="710" text-anchor="middle" font-size="14" font-weight="700" fill="#26334b">列の幅は、どれも同じ。</text>
<text x="180" y="735" text-anchor="middle" font-size="13.5" fill="#52647b">変わるのは背景の幅と位置。</text>
</g>
</svg>